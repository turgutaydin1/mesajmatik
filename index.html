<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mesajmatik</title>
<style>
:root{--y:#2f7d5a;--yk:#1f5d43;--a:#b9943f;--t:#26332c;--s:#6d7871}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eef5f0,#faf7ef);color:var(--t)}
.wrap{max-width:780px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8e3;border-radius:22px;overflow:hidden;box-shadow:0 12px 34px #23452f18}
header{text-align:center;padding:25px 18px;background:linear-gradient(135deg,#edf7f0,#fff9eb);border-bottom:1px solid #e7ece8}header .moon{font-size:34px}h1{margin:4px 0;color:var(--yk)}header p{margin:4px;color:var(--s);font-size:14px}
.content{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}select,input,textarea{width:100%;padding:12px 13px;border:1px solid #ccd6cf;border-radius:11px;font-size:15px;background:#fff;color:#26332c}textarea{min-height:190px;line-height:1.55;resize:vertical}
.mainbtn{width:100%;margin-top:14px;background:linear-gradient(135deg,#2f7d5a,#b9943f);color:#fff;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:900;cursor:pointer}.mainbtn:disabled{opacity:.65}
.sec{margin-top:20px;padding-top:18px;border-top:1px dashed #d8dfda}.sec h3{margin:0 0 10px;color:var(--yk)}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}button{border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:800;cursor:pointer}.blue{background:#2f6da1;color:#fff}.soft{background:#e9f1eb;color:var(--yk)}.gold{background:#b68d2f;color:#fff}.green{background:var(--y);color:#fff}.status{min-height:20px;margin-top:9px;color:var(--yk);font-size:13px;font-weight:700}
canvas{display:none;width:100%;height:auto;border-radius:16px;border:1px solid #dfe6e0}.note{font-size:12px;color:#758079;background:#f6f8f6;padding:10px;border-radius:9px;margin-top:10px;line-height:1.45}.footer{text-align:center;color:#828b86;font-size:12px;padding:0 18px 20px}
@media(max-width:640px){.grid,.three{grid-template-columns:1fr}.wrap{padding:8px}.content{padding:14px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<header><div class="moon">🌙</div><h1>Mesajmatik</h1><p>Manevi günler için özgün mesaj ve paylaşım kartı oluşturucu</p></header>
<div class="content">
<div class="grid">
<div><label>Özel Gün / Zaman</label><select id="gunSecim"><option>Berat Kandili</option><option>Kadir Gecesi</option><option>Mevlid Kandili</option><option>Regaib Kandili</option><option>Miraç Kandili</option><option>Ramazan Bayramı</option><option>Kurban Bayramı</option><option>Cuma Günü</option><option>Ramazan Ayı</option><option>Arefe Günü</option></select></div>
<div><label>Üslup</label><select id="uslup"><option value="samimi">Samimi</option><option value="resmi">Resmî</option><option value="kurumsal">Kurumsal</option><option value="dua">Dua ağırlıklı</option><option value="kaynakli">Ayet / Hadis ağırlıklı</option></select></div>
<div><label>Mesaj Uzunluğu</label><select id="uzunluk"><option value="kisa">Kısa</option><option value="orta" selected>Orta</option><option value="uzun">Uzun</option></select></div>
<div><label>Hitap</label><select id="hitap"><option value="">Hitap ekleme</option><option>Değerli Dostlarım</option><option>Kıymetli Dostlarım</option><option>Değerli Mesai Arkadaşlarım</option><option>Kıymetli Ailem</option><option>Değerli Çalışma Arkadaşlarımız</option></select></div>
<div class="full"><label>Özel Vurgu / Anahtar Kelimeler</label><input id="anahtarKelime" autocomplete="off"></div>
<div class="full"><label>İsim / Kurum / Şirket Adı</label><input id="imza" autocomplete="off"></div>
</div>
<button class="mainbtn" id="olusturBtn" onclick="mesajOlustur()">✨ Mesajı Oluştur</button>
<div class="sec"><h3>Oluşturulan Mesaj</h3><textarea id="sonuc" readonly placeholder="Mesajınız burada görünecek..."></textarea><div class="three"><button class="blue" onclick="kopyala()">📋 Kopyala</button><button class="soft" onclick="whatsapp()">🟢 WhatsApp</button><button class="gold" onclick="kartOlustur(false)">🖼️ Görsel Kart Oluştur</button></div><div class="status" id="status"></div></div>
<div class="sec"><h3>Paylaşım Kartı</h3><canvas id="kartCanvas" width="1080" height="1080"></canvas><div class="three"><button class="green" onclick="kartIndir()">⬇️ Görseli Kaydet</button><button class="soft" onclick="kartPaylas()">📤 Görseli Paylaş</button><button class="soft" onclick="kartOlustur(true)">🎨 Tasarımı Değiştir</button></div><div class="note">Kart düzeni ve simgesi seçilen güne göre değişir. Uzun metinlerde yazı boyutu karta sığacak şekilde otomatik ayarlanır.</div></div>
</div><div class="footer">Mesajmatik</div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwZVpAEB4IYujc-yNL2mOLgHnV-t6i2OO32bWgV8r8OeeZeeMYJDh4r58_rfFXXLOTR/exec";
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)];
window.__mesajmatikDebug={engine:null,detail:null,time:null};
let lastAiText="";

const canonical={
"gazze":"Gazze","doğu türkistan":"Doğu Türkistan","filistin":"Filistin","kudüs":"Kudüs","mekke":"Mekke","medine":"Medine","suriye":"Suriye","yemen":"Yemen","arakan":"Arakan","islam alemi":"İslam âlemi","islam âlemi":"İslam âlemi"
};
const conceptWords=new Set(["umut","sabır","çocuk","çocuklar","birlik","kardeşlik","sağlık","huzur","bereket","merhamet","affetmek","af","dua","dualar","sevgi","barış","adalet","yardımlaşma"]);
function splitTerms(raw){return raw.split(/[,;]+/).map(x=>x.trim()).filter(Boolean)}
function properTerms(raw){if(!raw)return[];const out=[];for(const t of splitTerms(raw)){const low=t.toLocaleLowerCase("tr-TR");if(canonical[low])out.push(canonical[low]);else if(!conceptWords.has(low)&&(/[A-ZÇĞİÖŞÜ]/.test(t[0]||"")||t.split(/\s+/).length>1))out.push(t)}return [...new Set(out)]}
function compactAiInstruction(raw){if(!raw)return"";const names=properTerms(raw);let s="Kullanıcının ifadeleri: "+raw+". Liste gibi sıralama; anlam ilişkisini kurup doğal cümlelere dağıt.";if(names.length)s+=" Şu özel adları mesajda aynen geçir: "+names.join(", ")+".";s+=" Aynı kalıbı ve aynı fiili art arda kullanma.";return s.slice(0,340)}

const fallbackBanks={
 samimi:{
  open:["Bu güzel vaktin gönlümüze huzur, evlerimize bereket getirmesini diliyorum.","Manevi iklimini derinden hissettiğimiz bu özel zamanda gönlünüzün ferah olmasını diliyorum.","Kalplerimizi iyiliğe ve duaya yaklaştıran bu kıymetli vakitte sizi gönülden selamlıyorum.","Bu anlamlı günün gönlünüzde huzur ve umut bırakmasını diliyorum."],
  mid:["Sevdiklerinizle birlikte sağlık ve muhabbet içinde nice güzel günlere erişmeniz dileğiyle.","Güzel niyetlerinizin hayırla karşılık bulması, gönlünüzün ferah kalması en içten dileğimdir.","Kırgınlıkların azaldığı, muhabbetin ve paylaşmanın çoğaldığı günlere erişelim.","Rabbim gönlünüzden geçen hayırlı niyetleri güzelliklere dönüştürsün."],
  close:["Kandiliniz mübarek olsun.","Bu mübarek vakit hayırlara vesile olsun.","Gönlünüz huzurla, haneniz bereketle dolsun."]
 },
 resmi:{
  open:["Bu mübarek günün sağlık, huzur ve esenliğe vesile olmasını dilerim.","Manevi değeri yüksek bu özel günün hayırlara vesile olmasını saygıyla dilerim.","Bu anlamlı vaktin gönüllerde huzur, hayatlarda iyilik ve esenlik doğurmasını dilerim."],
  mid:["Sevdiklerinizle birlikte sağlık ve afiyet içinde nice güzel günlere erişmenizi gönülden dilerim.","Toplumsal dayanışma ve kardeşlik duygularının güçlenmesine katkı sunmasını ümit ederim.","Duaların ve güzel niyetlerin kabulüne vesile olmasını dilerim.","Bu özel günün birlik, huzur ve karşılıklı anlayış duygularını güçlendirmesini dilerim."],
  close:["Kandilinizi tebrik eder, sağlık ve esenlikler dilerim.","Bu mübarek gününüzü tebrik ederim.","Hayırlı ve huzurlu bir kandil dilerim."]
 },
 kurumsal:{
  open:["Bu mübarek günün hepimiz için huzur, birlik ve hayırlara vesile olmasını diliyoruz.","Manevi değerlerimizi hatırlatan bu özel günü en içten dileklerimizle karşılıyoruz.","Bu anlamlı vaktin kurumumuz ve tüm toplumumuz için iyilik, dayanışma ve esenlik getirmesini diliyoruz."],
  mid:["Birlik ve dayanışma duygularımızın güçlendiği, ortak değerlerimizin bizi daha da yakınlaştırdığı günler diliyoruz.","Çalışanlarımızın, ailelerinin ve tüm sevdiklerimizin sağlık ve huzur içinde olmasını diliyoruz.","Paylaşma, merhamet ve karşılıklı anlayışın hayatımızda daha fazla yer bulmasını önemsiyoruz."],
  close:["Kandilinizi kutlar, sağlık ve huzur dileriz.","Tüm paydaşlarımızın kandilini kutlarız.","Bu mübarek günün hayırlara vesile olmasını dileriz."]
 },
 dua:{
  open:["Rabbim bu mübarek vaktin rahmetinden ve bereketinden hepimizi nasiplendirsin.","Allah gönüllerimizi iyiliğe, merhamete ve samimi duaya açık eylesin.","Rabbim bu kıymetli gecede dualarımızı hayırla karşılasın, gönüllerimize ferahlık versin."],
  mid:["Kalplerimize huzur, hanelerimize bereket, ömrümüze hayır ihsan eylesin.","Dertlere deva, gönüllere şifa, sıkıntılara ferahlık nasip eylesin.","Bizi sevdiklerimizle birlikte sağlık, iman ve güzel ahlak üzere daim eylesin.","Mazlumların yükünü hafifletsin, ihtiyaç sahiplerine yardım eli uzatabilmeyi nasip etsin."],
  close:["Dualarımız hayra, gecemiz rahmete vesile olsun.","Rabbim gönüllerimizden geçen hayırlı duaları kabul eylesin.","Bu mübarek vakit hepimiz için hayırlara vesile olsun."]
 },
 kaynakli:{
  open:["“Şüphesiz zorlukla beraber bir kolaylık vardır.” (İnşirah, 94/6) Bu ilahi müjdeyi hatırladığımız bu özel vakitte gönüllerimizin umutla güçlenmesini diliyorum.","“Şüphesiz Allah sabredenlerle beraberdir.” (Bakara, 2/153) Bu mübarek günde sabrımızın ve teslimiyetimizin güçlenmesini diliyorum.","“Allah sizin için kolaylık ister, zorluk istemez.” (Bakara, 2/185) Bu rahmet ikliminin hayatımıza kolaylık ve huzur getirmesini diliyorum."],
  mid:["Güzel niyetlerin davranışlara, duaların iyiliğe ve merhamete dönüşmesi en büyük temennimiz olsun.","Kalplerimizin iyilikte birleştiği, kardeşlik ve dayanışmanın güçlendiği günlere erişelim.","Bu manevi hatırlayışın hayatımıza daha fazla sabır, şükür ve merhamet katmasına vesile olmasını diliyorum."],
  close:["Kandiliniz mübarek olsun.","Bu mübarek vakit hayırlara vesile olsun.","Geceniz huzur ve rahmetle dolsun."]
 }
};

const dayClosings={
"Cuma Günü":["Cumanız mübarek olsun.","Hayırlı Cumalar.","Cumanız huzur ve hayra vesile olsun."],
"Ramazan Bayramı":["Ramazan Bayramınız mübarek olsun.","Bayramınız huzur ve sevinçle geçsin."],
"Kurban Bayramı":["Kurban Bayramınız mübarek olsun.","Bayramınız hayırlara vesile olsun."],
"Ramazan Ayı":["Ramazan-ı Şerifiniz mübarek olsun.","Ramazan ayınız hayırlara vesile olsun."],
"Arefe Günü":["Arefe gününüz mübarek olsun.","Arefe gününüz hayırlara vesile olsun."],
"Kadir Gecesi":["Kadir Geceniz mübarek olsun.","Bu mübarek gece hayırlara vesile olsun."]
};
function fallbackContext(raw,style){if(!raw)return"";const terms=splitTerms(raw),names=properTerms(raw),low=raw.toLocaleLowerCase("tr-TR"),parts=[];
 if(names.length){const joined=names.length===1?names[0]:names.slice(0,-1).join(", ")+" ve "+names[names.length-1];parts.push(pick([
  joined+" için adaletin, güvenliğin ve huzurun hâkim olduğu günlere kavuşmayı diliyorum.",
  "Dualarımızda "+joined+"'yi de unutmuyor; oradaki insanların huzur ve selamete kavuşmasını diliyorum.",
  joined+" başta olmak üzere sıkıntı içindeki tüm insanların güven ve esenliğe ulaşmasını diliyorum."
 ]))}
 if(low.includes("çocuk"))parts.push(pick(["Çocukların korkudan uzak, güvenli ve umut dolu bir geleceğe kavuşmasını diliyorum.","Masum çocukların huzur içinde büyüyebileceği yarınların çoğalmasını diliyorum."]));
 if(low.includes("umut")||low.includes("sabır"))parts.push(pick(["Zorluklar karşısında umudumuzu ve metanetimizi koruyabilmeyi diliyorum.","En güç zamanlarda bile sabrı, ümidi ve dayanışmayı diri tutabilmeyi diliyorum."]));
 if(!parts.length&&terms.length)parts.push("Gönlünüzde taşıdığınız "+terms.slice(0,2).join(" ve ")+" hassasiyetinin hayırlı gelişmelere vesile olmasını diliyorum.");
 if(style==="resmi")return parts.join(" ").replaceAll("diliyorum","ümit ederim");
 if(style==="kurumsal")return parts.join(" ").replaceAll("diliyorum","diliyoruz");
 return parts.join(" ")}
function dayClosing(g,style){const a=dayClosings[g];if(a)return pick(a);if(g.includes("Kandili"))return style==="resmi"?"Kandilinizi tebrik ederim.":style==="kurumsal"?"Kandilinizi kutlarız.":"Kandiliniz mübarek olsun.";return pick(fallbackBanks[style].close)}
function localMessage(){const g=$("gunSecim").value,style=$("uslup").value,z=$("uzunluk").value,h=$("hitap").value.trim(),raw=$("anahtarKelime").value.trim(),im=$("imza").value.trim();const bank=fallbackBanks[style]||fallbackBanks.samimi;const segments=[pick(bank.open)];const ctx=fallbackContext(raw,style);if(ctx)segments.push(ctx);if(z!=="kisa")segments.push(pick(bank.mid));if(z==="uzun")segments.push(pick(bank.mid));segments.push(dayClosing(g,style));let m=segments.filter(Boolean).join(" ").replace(/\s+/g," ").trim();if(h)m=h+",\n\n"+m;if(im)m+="\n\n"+im;return m}

function similarity(a,b){if(!a||!b)return 0;const A=new Set(a.toLocaleLowerCase("tr-TR").replace(/[^a-zçğıöşü0-9 ]/gi," ").split(/\s+/).filter(x=>x.length>3));const B=new Set(b.toLocaleLowerCase("tr-TR").replace(/[^a-zçğıöşü0-9 ]/gi," ").split(/\s+/).filter(x=>x.length>3));let hit=0;A.forEach(x=>{if(B.has(x))hit++});return hit/Math.max(1,Math.min(A.size,B.size))}
function mesajOlustur(){const b=$("olusturBtn");b.disabled=true;b.textContent="⏳ Mesaj hazırlanıyor...";$("status").textContent="Mesaj hazırlanıyor...";const cb="mesajmatikCb_"+Date.now()+"_"+Math.floor(Math.random()*99999);let done=false,timer;const raw=$("anahtarKelime").value.trim(),forced=properTerms(raw).join(", ");
 const cleanup=()=>{clearTimeout(timer);const s=document.getElementById(cb);if(s)s.remove();try{delete window[cb]}catch(e){}b.disabled=false;b.textContent="✨ Mesajı Oluştur"};
 const useFallback=detail=>{if(done)return;done=true;const text=localMessage();$("sonuc").value=text;$("status").textContent="Mesaj oluşturuldu.";window.__mesajmatikDebug={engine:"fallback",detail:detail||"api_unavailable",time:new Date().toISOString()};cleanup()};
 window[cb]=data=>{if(done)return;const text=data&&data.text?String(data.text).trim():"";if(text.length>20){done=true;const sim=similarity(lastAiText,text);lastAiText=text;$("sonuc").value=text;$("status").textContent="Mesaj oluşturuldu.";window.__mesajmatikDebug={engine:"ai",detail:"similarity:"+sim.toFixed(2),time:new Date().toISOString()};cleanup()}else useFallback(data&&data.error?String(data.error):"empty_response")};
 const q=new URLSearchParams({callback:cb,gun:$("gunSecim").value,uslup:$("uslup").value,uzunluk:$("uzunluk").value,hitap:$("hitap").value,anahtar:compactAiInstruction(raw),zorunluAdlar:forced,onceki:lastAiText.slice(0,800),imza:$("imza").value.trim(),_:String(Date.now())});
 const s=document.createElement("script");s.id=cb;s.src=API_URL+"?"+q.toString();s.onerror=()=>useFallback("network_error");document.body.appendChild(s);timer=setTimeout(()=>useFallback("timeout"),9000)}

async function kopyala(){if(!$("sonuc").value)return;try{await navigator.clipboard.writeText($("sonuc").value)}catch(e){$("sonuc").select();document.execCommand("copy")}$("status").textContent="Mesaj kopyalandı."}
function whatsapp(){if($("sonuc").value)window.open("https://wa.me/?text="+encodeURIComponent($("sonuc").value),"_blank")}

const styles={
"Berat Kandili":{a:"#103e35",b:"#6a947e",g:"#d6b45a",icon:"crescentStars",sub:"Af ve rahmet gecesi"},
"Kadir Gecesi":{a:"#172c55",b:"#5f75a8",g:"#e0c575",icon:"lantern",sub:"Bin aydan hayırlı gece"},
"Mevlid Kandili":{a:"#315b48",b:"#8ba58f",g:"#d3b36a",icon:"dome",sub:"Rahmet ve muhabbet"},
"Regaib Kandili":{a:"#513d67",b:"#9078a7",g:"#e1c68d",icon:"crescentStar",sub:"Rahmet ve bereket"},
"Miraç Kandili":{a:"#243f69",b:"#7090b4",g:"#d8bc6d",icon:"risingStars",sub:"Manevi yükseliş"},
"Ramazan Bayramı":{a:"#1f6a58",b:"#82ad8e",g:"#efd07a",icon:"gift",sub:"Sevinç ve kardeşlik"},
"Kurban Bayramı":{a:"#6a4a2d",b:"#a8865d",g:"#ead08b",icon:"kaaba",sub:"Paylaşma ve teslimiyet"},
"Cuma Günü":{a:"#28594d",b:"#729484",g:"#d7bb74",icon:"mosque",sub:"Huzur ve bereket"},
"Ramazan Ayı":{a:"#294f63",b:"#6f99a8",g:"#e0c174",icon:"lanternMoon",sub:"Rahmet ve bereket ayı"},
"Arefe Günü":{a:"#604d36",b:"#a28a68",g:"#e0c483",icon:"beads",sub:"Dua ve hazırlık vakti"}
};
let vary=0;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function star(c,x,y,r){c.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2===0?r:r*.42,px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;i?c.lineTo(px,py):c.moveTo(px,py)}c.closePath();c.fill()}
function crescent(c,x,y,r){c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.fill();c.save();c.globalCompositeOperation="destination-out";c.beginPath();c.arc(x+r*.34,y-r*.08,r*.82,0,Math.PI*2);c.fill();c.restore()}
function drawIcon(c,type,x,y,s,color){c.save();c.fillStyle=color;c.strokeStyle=color;c.lineWidth=7;c.lineCap="round";c.lineJoin="round";
 if(type==="crescentStars"){crescent(c,x-12,y,s*.3);star(c,x+42,y-28,s*.1);star(c,x+55,y+18,s*.065)}
 else if(type==="crescentStar"){crescent(c,x-18,y,s*.3);star(c,x+48,y,s*.14)}
 else if(type==="lantern"||type==="lanternMoon"){c.strokeRect(x-s*.2,y-s*.25,s*.4,s*.5);c.beginPath();c.moveTo(x-s*.1,y-s*.36);c.lineTo(x+s*.1,y-s*.36);c.moveTo(x,y-s*.36);c.lineTo(x,y-s*.48);c.stroke();star(c,x,y+s*.05,s*.07);if(type==="lanternMoon")crescent(c,x+s*.42,y-s*.25,s*.12)}
 else if(type==="dome"||type==="mosque"){c.beginPath();c.arc(x,y,s*.3,Math.PI,0);c.lineTo(x+s*.3,y+s*.23);c.lineTo(x-s*.3,y+s*.23);c.closePath();c.fill();c.fillRect(x-s*.38,y+s*.23,s*.76,s*.11);if(type==="mosque"){c.fillRect(x-s*.48,y-s*.02,s*.075,s*.36);c.fillRect(x+s*.405,y-s*.02,s*.075,s*.36)}}
 else if(type==="risingStars"){for(let i=0;i<4;i++){c.globalAlpha=.4+i*.18;star(c,x-45+i*28,y+40-i*28,s*(.045+i*.018))}c.globalAlpha=1;star(c,x+55,y-55,s*.12)}
 else if(type==="gift"){c.fillRect(x-s*.3,y-s*.05,s*.6,s*.4);c.fillRect(x-s*.36,y-s*.18,s*.72,s*.13);c.fillRect(x-s*.035,y-s*.18,s*.07,s*.53);c.beginPath();c.arc(x-s*.1,y-s*.27,s*.1,0,Math.PI*2);c.arc(x+s*.1,y-s*.27,s*.1,0,Math.PI*2);c.fill()}
 else if(type==="kaaba"){c.fillRect(x-s*.31,y-s*.28,s*.62,s*.56);c.save();c.fillStyle="#e1c06a";c.fillRect(x-s*.31,y-s*.06,s*.62,s*.07);c.restore()}
 else if(type==="beads"){c.lineWidth=5;c.beginPath();c.arc(x,y,s*.3,0,Math.PI*1.7);c.stroke();for(let i=0;i<13;i++){const a=.18+i*.39;c.beginPath();c.arc(x+Math.cos(a)*s*.3,y+Math.sin(a)*s*.3,s*.03,0,Math.PI*2);c.fill()}c.fillRect(x+s*.28,y+s*.18,s*.04,s*.18)}c.restore()}
function wrapLine(c,text,w){const words=text.trim().split(/\s+/),lines=[];let line="";for(const word of words){const t=line?line+" "+word:word;if(c.measureText(t).width>w&&line){lines.push(line);line=word}else line=t}if(line)lines.push(line);return lines}
function textLayout(c,text,w,fontSize){c.font=fontSize+"px Georgia";const paras=text.split(/\n\s*\n/).map(x=>x.trim()).filter(Boolean),lines=[];paras.forEach((p,pi)=>{wrapLine(c,p,w).forEach(x=>lines.push(x));if(pi<paras.length-1)lines.push("")});return lines}
function fitText(c,text,w,maxH){for(let fs=30;fs>=20;fs--){const lines=textLayout(c,text,w,fs),lh=Math.round(fs*1.48),h=lines.length*lh;if(h<=maxH)return{fs,lines,lh}}return{fs:20,lines:textLayout(c,text,w,20),lh:30}}
function justify(c,line,x,y,w,last){if(!line)return;const a=line.split(" ");c.textAlign="left";if(last||a.length<2){c.fillText(line,x,y);return}const tw=a.reduce((n,q)=>n+c.measureText(q).width,0),gap=(w-tw)/(a.length-1);let cx=x;for(const q of a){c.fillText(q,cx,y);cx+=c.measureText(q).width+gap}}

function kartOlustur(change=false){if(!$("sonuc").value.trim())$("sonuc").value=localMessage();if(change)vary=(vary+1)%3;const cv=$("kartCanvas"),c=cv.getContext("2d"),gun=$("gunSecim").value,st=styles[gun]||styles["Cuma Günü"];cv.style.display="block";const gr=c.createLinearGradient(0,0,1080,1080);gr.addColorStop(0,st.a);gr.addColorStop(1,st.b);c.fillStyle=gr;c.fillRect(0,0,1080,1080);drawFrame(c,st,vary);

 c.textAlign="center";c.fillStyle=st.a;c.font="700 46px Georgia";const titleX=vary===1?610:540,titleY=vary===2?315:325;c.fillText(gun,titleX,titleY);c.fillStyle="#8b7645";c.font="italic 24px Georgia";c.fillText(st.sub,titleX,titleY+38);

 if(im){c.fillStyle=st.a;c.font="700 29px Georgia";c.textAlign="right";c.fillText(im,vary===1?930:920,930)}c.textAlign="center";c.fillStyle="#8a8f8b";c.font="18px Arial";c.fillText("Mesajmatik",540,978)}
