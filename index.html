<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesajmatik</title>
<style>
:root{--y:#2f7d5a;--yk:#1f5d43;--a:#b9943f;--t:#26332c;--s:#6e7972}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(#edf5ef,#faf7ef);color:var(--t)}
.wrap{max-width:760px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8e3;border-radius:20px;overflow:hidden;box-shadow:0 10px 30px #23452f18}
header{text-align:center;padding:24px 18px;background:linear-gradient(135deg,#edf7f0,#fff9eb);border-bottom:1px solid #e6ebe7}h1{margin:4px 0;color:var(--yk)}header p{margin:4px;color:var(--s);font-size:14px}.content{padding:18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{font-size:13px;font-weight:700;display:block;margin:0 0 6px}select,input,textarea{width:100%;padding:12px;border:1px solid #ccd5cf;border-radius:10px;font-size:15px;background:#fff}textarea{min-height:180px;line-height:1.5;resize:vertical}
button{width:100%;border:0;border-radius:10px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}.primary{background:linear-gradient(135deg,var(--y),var(--a));color:#fff}.soft{background:#e8f1eb;color:var(--yk)}.blue{background:#2f6da1;color:#fff}.gold{background:#b68d2f;color:#fff}
.sec{margin-top:20px;padding-top:18px;border-top:1px dashed #d8dfda}.sec h3{margin:0 0 10px;color:var(--yk)}.status{min-height:22px;margin-top:10px;font-size:13px;font-weight:700;color:var(--yk)}
canvas{display:none;width:100%;height:auto;border:1px solid #dfe6e0;border-radius:14px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}.footer{text-align:center;padding:0 18px 20px;color:#808a84;font-size:12px}
@media(max-width:640px){.grid,.three{grid-template-columns:1fr}.wrap{padding:8px}.content{padding:14px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<header><div style="font-size:34px">🌙</div><h1>Mesajmatik</h1><p>Manevi günler için özgün mesaj ve paylaşım kartı oluşturucu</p></header>
<div class="content">
<div class="grid">
<div><label>Özel Gün / Zaman</label><select id="gunSecim"><option>Berat Kandili</option><option>Kadir Gecesi</option><option>Mevlid Kandili</option><option>Regaib Kandili</option><option>Miraç Kandili</option><option>Ramazan Bayramı</option><option>Kurban Bayramı</option><option>Cuma Günü</option><option>Ramazan Ayı</option><option>Arefe Günü</option></select></div>
<div><label>Üslup</label><select id="uslup"><option value="samimi">Samimi</option><option value="resmi">Resmî</option><option value="kurumsal">Kurumsal</option><option value="dua">Dua ağırlıklı</option></select></div>
<div><label>Mesaj Uzunluğu</label><select id="uzunluk"><option value="kisa">Kısa</option><option value="orta" selected>Orta</option><option value="uzun">Uzun</option></select></div>
<div><label>Hitap</label><select id="hitap"><option value="">Hitap ekleme</option><option>Değerli Dostlarım</option><option>Kıymetli Dostlarım</option><option>Değerli Mesai Arkadaşlarım</option><option>Kıymetli Ailem</option><option>Değerli Çalışma Arkadaşlarımız</option></select></div>
<div class="full"><label>Özel Vurgu / Anahtar Kelimeler</label><input id="anahtarKelime" placeholder="Örn: Gazze, Doğu Türkistan, tüm İslam âlemi, birlik, sağlık, huzur..."></div>
<div class="full"><label>İsim / Kurum / Şirket Adı</label><input id="imza" placeholder="Örn: Turgut Aydın"></div>
</div>
<div style="margin-top:14px"><button class="primary" id="olusturBtn" onclick="mesajOlustur()">✨ Mesajı Oluştur</button></div>
<div class="sec"><h3>Oluşturulan Mesaj</h3><textarea id="sonuc" readonly></textarea><div class="three"><button class="blue" onclick="kopyala()">📋 Kopyala</button><button class="soft" onclick="whatsapp()">🟢 WhatsApp</button><button class="gold" onclick="kartOlustur(false)">🖼️ Görsel Kart</button></div><div id="status" class="status"></div></div>
<div class="sec"><h3>Paylaşım Kartı</h3><canvas id="kartCanvas" width="1080" height="1080"></canvas><div class="three"><button class="primary" onclick="kartIndir()">⬇️ Görseli Kaydet</button><button class="soft" onclick="kartPaylas()">📤 Görseli Paylaş</button><button class="soft" onclick="kartOlustur(true)">🎨 Tasarımı Değiştir</button></div></div>
</div><div class="footer">Mesajmatik</div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwZVpAEB4IYujc-yNL2mOLgHnV-t6i2OO32bWgV8r8OeeZeeMYJDh4r58_rfFXXLOTR/exec";
const $=id=>document.getElementById(id),sec=a=>a[Math.floor(Math.random()*a.length)];
const acilis=["Gönüllerin huzurla buluştuğu bu mübarek {gun} vesilesiyle","Rahmet ve bereket iklimini yeniden hissettiğimiz bu kıymetli {gun} vesilesiyle","Kalplerimizin iyilik, merhamet ve umutla dolduğu bu mübarek {gun} gününde","Manevi güzelliklerin gönüllerimizi kuşattığı bu özel {gun} vesilesiyle","Bu anlamlı {gun} vesilesiyle gönülden geçen güzel dileklerin ve duaların çoğalmasını temenni ediyorum"];
const dilek=["sağlık, huzur, bereket ve gönül ferahlığı diliyorum","evlerinize bereket, gönüllerinize huzur ve hayatınıza hayırlar getirmesini diliyorum","sevdiklerinizle birlikte huzur ve afiyet içinde nice güzel günlere erişmenizi temenni ediyorum","dualarınızın kabul, gönüllerinizin huzurlu olmasını diliyorum","kalplerimizdeki iyiliğin, merhametin ve kardeşliğin güçlenmesini diliyorum"];
const dualar=["Rabbim edilen duaları kabul, güzel niyetleri hayra vesile eylesin.","Rabbim birlik ve beraberliğimizi daim, gönüllerimizi merhametle güçlü kılsın.","Rabbim bizleri sevdiklerimizle birlikte sağlık, huzur ve hayır üzere yaşatsın.","Bu mübarek vaktin affa, rahmete ve güzel yarınlara vesile olmasını diliyorum.","Dualarımızın gönüllere ferahlık, hanelere bereket getirmesini diliyorum."];
function kapanis(g){if(g==="Cuma Günü")return"Cumanız mübarek olsun.";if(g.includes("Kandili"))return"Kandiliniz mübarek olsun.";if(g.includes("Gecesi"))return"Geceniz mübarek olsun.";if(g.includes("Bayramı"))return"Bayramınız mübarek olsun.";if(g==="Ramazan Ayı")return"Ramazan-ı Şerifiniz mübarek olsun.";if(g==="Arefe Günü")return"Arefe gününüz mübarek olsun.";return"Bu mübarek vaktiniz hayırlara vesile olsun."}
function vurgu(a){if(!a)return"";const x=a.toLowerCase();let s=` ${a} için de gönülden dualarımızı ekliyor; hayra, huzura ve selamete vesile olmasını diliyorum.`;if(x.includes("gazze")||x.includes("türkistan")||x.includes("mazlum"))s+=" Zulüm ve sıkıntı içindeki bütün insanların onurlu bir şekilde huzura, güvene ve adalete kavuşmasını diliyorum.";return s}
function yerelMesaj(){const g=$("gunSecim").value,u=$("uslup").value,z=$("uzunluk").value,h=$("hitap").value,a=$("anahtarKelime").value.trim(),i=$("imza").value.trim();let m=sec(acilis).replace("{gun}",g)+"; "+sec(dilek)+"."+vurgu(a);if(z!=="kisa")m+=" "+sec(dualar);if(z==="uzun")m+=" Bu özel vaktin, kırgınlıkların yerini muhabbete; yorgunlukların yerini umuda bırakmasına ve bizi birbirimize daha sıkı bağlamasına vesile olmasını temenni ediyorum.";m+=" "+kapanis(g);if(u==="resmi")m=m.replaceAll("diliyorum","temenni ederim");if(u==="kurumsal")m=m.replaceAll("diliyorum","temenni ediyoruz");m=(h?h+",\n\n":"")+m;if(i)m+="\n\n"+i;return m}
function mesajOlustur(){const b=$("olusturBtn");b.disabled=true;b.textContent="⏳ Mesaj hazırlanıyor...";$("status").textContent="Mesaj hazırlanıyor...";const cb="mesajmatikCb_"+Date.now();let done=false;const cleanup=()=>{const s=$("jsonpScript");if(s)s.remove();try{delete window[cb]}catch(e){}b.disabled=false;b.textContent="✨ Mesajı Oluştur"};const fallback=()=>{if(done)return;done=true;$("sonuc").value=yerelMesaj();$("status").textContent="Mesaj hazır.";cleanup()};window[cb]=(data)=>{if(done)return;done=true;if(data&&data.text){$("sonuc").value=String(data.text).trim();$("status").textContent="Mesaj hazır."}else{$("sonuc").value=yerelMesaj();$("status").textContent="Mesaj hazır."}cleanup()};const p=new URLSearchParams({callback:cb,gun:$("gunSecim").value,uslup:$("uslup").value,uzunluk:$("uzunluk").value,hitap:$("hitap").value,anahtar:$("anahtarKelime").value.trim(),imza:$("imza").value.trim(),nonce:String(Date.now())});const s=document.createElement("script");s.id="jsonpScript";s.src=API_URL+"?"+p.toString();s.onerror=fallback;document.body.appendChild(s);setTimeout(fallback,12000)}
async function kopyala(){if(!$("sonuc").value)return;try{await navigator.clipboard.writeText($("sonuc").value)}catch(e){$("sonuc").select();document.execCommand("copy")}$("status").textContent="Mesaj kopyalandı."}
function whatsapp(){if($("sonuc").value)window.open("https://wa.me/?text="+encodeURIComponent($("sonuc").value),"_blank")}
const temalar=[{a:"#eaf5ee",b:"#fffaf0",c:"#e5efe8",cer:"#c7a64d",ana:"#2f7d5a"},{a:"#f5f0e4",b:"#fffdf7",c:"#e8f0e8",cer:"#a8873c",ana:"#356a50"},{a:"#eef2eb",b:"#fbf6e9",c:"#e7eee4",cer:"#8f7540",ana:"#3f7559"}];let ti=0;
function lines(ctx,text,w){const ws=text.trim().split(/\s+/),ls=[];let l="";for(const x of ws){const t=l?l+" "+x:x;if(ctx.measureText(t).width>w&&l){ls.push(l);l=x}else l=t}if(l)ls.push(l);return ls}
function justify(ctx,line,x,y,w,last){const ws=line.split(" ");ctx.textAlign="left";if(last||ws.length<2){ctx.fillText(line,x,y);return}const tw=ws.reduce((s,q)=>s+ctx.measureText(q).width,0),gap=(w-tw)/(ws.length-1);let cx=x;for(const q of ws){ctx.fillText(q,cx,y);cx+=ctx.measureText(q).width+gap}}
function kartOlustur(change){if(!$("sonuc").value.trim())$("sonuc").value=yerelMesaj();if(change)ti=(ti+1)%temalar.length;const t=temalar[ti],c=$("kartCanvas"),ctx=c.getContext("2d");c.style.display="block";const g=ctx.createLinearGradient(0,0,1080,1080);g.addColorStop(0,t.a);g.addColorStop(.55,t.b);g.addColorStop(1,t.c);ctx.fillStyle=g;ctx.fillRect(0,0,1080,1080);ctx.strokeStyle=t.cer;ctx.lineWidth=5;ctx.strokeRect(52,52,976,976);ctx.beginPath();ctx.arc(540,145,54,0,Math.PI*2);ctx.fillStyle=t.ana;ctx.fill();ctx.fillStyle="#fff";ctx.font="58px serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("☾",540,142);ctx.textBaseline="alphabetic";ctx.fillStyle=t.ana;ctx.font="bold 47px Arial";ctx.fillText($("gunSecim").value,540,255);ctx.strokeStyle=t.cer;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(260,295);ctx.lineTo(820,295);ctx.stroke();const raw=$("sonuc").value.trim(),hit=$("hitap").value.trim(),im=$("imza").value.trim();let body=raw;if(hit&&body.startsWith(hit)){body=body.slice(hit.length).replace(/^,?\s*/,"")}if(im&&body.endsWith(im))body=body.slice(0,-im.length).trim();const x=145,w=790;let y=360;ctx.fillStyle="#28372f";if(hit){ctx.font="bold 31px Arial";ctx.textAlign="left";ctx.fillText(hit+",",x,y);y+=72}ctx.font="31px Arial";const ls=lines(ctx,body.replace(/\s+/g," "),w);for(let n=0;n<Math.min(ls.length,12);n++){justify(ctx,ls[n],x,y,w,n===ls.length-1);y+=48}if(im){y=Math.min(900,Math.max(y+55,760));ctx.font="bold 31px Arial";ctx.textAlign="right";ctx.fillText(im,930,y)}ctx.fillStyle="#788078";ctx.font="22px Arial";ctx.textAlign="center";ctx.fillText("Mesajmatik",540,980)}
function kartIndir(){kartOlustur(false);const a=document.createElement("a");a.download="mesajmatik-kart.png";a.href=$("kartCanvas").toDataURL("image/png");a.click()}
function kartPaylas(){kartOlustur(false);$("kartCanvas").toBlob(async blob=>{const f=new File([blob],"mesajmatik-kart.png",{type:"image/png"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:"Mesajmatik"})}catch(e){}}else alert("Bu cihaz doğrudan görsel paylaşımını desteklemiyor.")},"image/png")}
</script>
</body>
</html>
