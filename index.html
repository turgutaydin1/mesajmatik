<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Mesajmatik</title>
<style>
:root{--y:#2f7d5a;--yk:#1f5d43;--a:#b9943f;--t:#26332c;--s:#6d7871}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eef5f0,#faf7ef);color:var(--t)}
.wrap{max-width:780px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8e3;border-radius:22px;overflow:hidden;box-shadow:0 12px 34px #23452f18}
header{text-align:center;padding:25px 18px;background:linear-gradient(135deg,#edf7f0,#fff9eb);border-bottom:1px solid #e7ece8}header .moon{font-size:34px}h1{margin:4px 0;color:var(--yk)}header p{margin:4px;color:var(--s);font-size:14px}
.content{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}
select,input,textarea{width:100%;padding:12px 13px;border:1px solid #ccd6cf;border-radius:11px;font-size:15px;background:#fff;color:#26332c}textarea{min-height:190px;line-height:1.55;resize:vertical}
.mainbtn{width:100%;margin-top:14px;background:linear-gradient(135deg,#2f7d5a,#b9943f);color:#fff;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:900;cursor:pointer}.mainbtn:disabled{opacity:.65}
.sec{margin-top:20px;padding-top:18px;border-top:1px dashed #d8dfda}.sec h3{margin:0 0 10px;color:var(--yk)}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}
button{border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:800;cursor:pointer}.blue{background:#2f6da1;color:#fff}.soft{background:#e9f1eb;color:var(--yk)}.gold{background:#b68d2f;color:#fff}.green{background:var(--y);color:#fff}
.status{min-height:20px;margin-top:9px;color:var(--yk);font-size:13px;font-weight:700}canvas{display:none;width:100%;height:auto;border-radius:16px;border:1px solid #dfe6e0}
.note{font-size:12px;color:#758079;background:#f6f8f6;padding:10px;border-radius:9px;margin-top:10px;line-height:1.45}.footer{text-align:center;color:#828b86;font-size:12px;padding:0 18px 20px}
@media(max-width:640px){.grid,.three{grid-template-columns:1fr}.wrap{padding:8px}.content{padding:14px}}
</style>
</head>
<body>
<div class="wrap"><div class="card">
<header><div class="moon">🌙</div><h1>Mesajmatik</h1><p>Manevi günler için özgün mesaj ve paylaşım kartı oluşturucu</p></header>
<div class="content">
<div class="grid">
<div><label>Özel Gün / Zaman</label><select id="gunSecim"><option>Berat Kandili</option><option>Kadir Gecesi</option><option>Mevlid Kandili</option><option>Regaib Kandili</option><option>Miraç Kandili</option><option>Ramazan Bayramı</option><option>Kurban Bayramı</option><option>Cuma Günü</option><option>Ramazan Ayı</option><option>Arefe Günü</option></select></div>
<div><label>Üslup</label><select id="uslup"><option value="samimi">Samimi</option><option value="resmi">Resmî</option><option value="kurumsal">Kurumsal</option><option value="dua">Dua ağırlıklı</option><option value="kaynakli">Ayet / Hadis ağırlıklı</option></select></div>
<div><label>Mesaj Uzunluğu</label><select id="uzunluk"><option value="kisa">Kısa</option><option value="orta" selected>Orta</option><option value="uzun">Uzun</option></select></div>
<div><label>Hitap</label><select id="hitap"><option value="">Hitap ekleme</option><option>Değerli Dostlarım</option><option>Kıymetli Dostlarım</option><option>Değerli Mesai Arkadaşlarım</option><option>Kıymetli Ailem</option><option>Değerli Çalışma Arkadaşlarımız</option></select></div>
<div class="full"><label>Özel Vurgu / Anahtar Kelimeler</label><input id="anahtarKelime" autocomplete="off"></div>
<div class="full"><label>İsim / Kurum / Şirket Adı</label><input id="imza" autocomplete="off"></div>
</div>
<button class="mainbtn" id="olusturBtn" onclick="mesajOlustur()">✨ Mesajı Oluştur</button>

<div class="sec"><h3>Oluşturulan Mesaj</h3><textarea id="sonuc" readonly placeholder="Mesajınız burada görünecek..."></textarea>
<div class="three"><button class="blue" onclick="kopyala()">📋 Kopyala</button><button class="soft" onclick="whatsapp()">🟢 WhatsApp</button><button class="gold" onclick="kartOlustur(false)">🖼️ Görsel Kart Oluştur</button></div><div class="status" id="status"></div></div>

<div class="sec"><h3>Paylaşım Kartı</h3><canvas id="kartCanvas" width="1080" height="1080"></canvas>
<div class="three"><button class="green" onclick="kartIndir()">⬇️ Görseli Kaydet</button><button class="soft" onclick="kartPaylas()">📤 Görseli Paylaş</button><button class="soft" onclick="kartOlustur(true)">🎨 Tasarımı Değiştir</button></div>
<div class="note">Kart düzeni seçilen güne göre değişir. Uzun metinlerde yazı boyutu karta sığacak şekilde otomatik ayarlanır.</div></div>
</div><div class="footer">Mesajmatik</div></div></div>

<script>
const API_URL="https://script.google.com/macros/s/AKfycbwZVpAEB4IYujc-yNL2mOLgHnV-t6i2OO32bWgV8r8OeeZeeMYJDh4r58_rfFXXLOTR/exec";
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)];
window.__mesajmatikDebug={engine:null,detail:null,time:null};
let lastAiText="";

const fallbackBanks={
 samimi:{
  open:["Bu özel vaktin gönlünüze huzur ve iyilik getirmesini gönülden diliyorum.","Manevi değeri yüksek bu güzel zamanda sizi sevgi ve muhabbetle anıyorum.","Bu anlamlı günün gönlünüzde güzel izler bırakmasını diliyorum."],
  mid:["Sevdiklerinizle birlikte sağlık ve muhabbet içinde nice güzel günlere erişmeniz en içten dileğimdir.","Güzel niyetlerinizin hayırla karşılık bulması ve gönlünüzün ferah kalması dileğiyle.","Kırgınlıkların azaldığı, paylaşmanın ve iyiliğin çoğaldığı günlere erişelim."],
  close:["Kandiliniz mübarek olsun.","Bu mübarek vakit size ve sevdiklerinize hayır getirsin.","Gönlünüz huzurla dolsun."]
 },
 resmi:{
  open:["Bu anlamlı gün vesilesiyle en iyi dileklerimi sunarım.","Manevi değeri yüksek bu özel günün hayırlara vesile olmasını dilerim.","Bu mübarek günün sağlık, esenlik ve huzur getirmesini temenni ederim."],
  mid:["Bu vesileyle size ve sevdiklerinize sağlık ve esenlik dilerim.","Birlik, dayanışma ve karşılıklı anlayışın güçlenmesini ümit ederim.","Bu özel günün güzel gelişmelere kapı aralamasını temenni ederim."],
  close:["Kandilinizi tebrik ederim.","Bu mübarek gününüzü saygıyla kutlarım.","Huzurlu ve hayırlı bir kandil dilerim."]
 },
 kurumsal:{
  open:["Bu anlamlı gün vesilesiyle ortak değerlerimizi ve dayanışmanın önemini bir kez daha hatırlıyoruz.","Manevi değerlerimizin bizi bir araya getirdiği bu özel günü birlik duygusuyla karşılıyoruz.","Bu mübarek günün toplumumuzda huzur ve dayanışmayı güçlendirmesini diliyoruz."],
  mid:["Çalışanlarımızın, paydaşlarımızın ve ailelerinin sağlık ve huzur içinde olmasını diliyoruz.","Paylaşma, merhamet ve sorumluluk duygularının hayatımızda daha fazla yer bulmasını önemsiyoruz.","Ortak değerler etrafında kenetlenmenin önemini bir kez daha vurguluyoruz."],
  close:["Kandilinizi en içten dileklerimizle kutlarız.","Tüm paydaşlarımızın kandilini kutlarız.","Bu anlamlı günün hepimiz için hayırlara vesile olmasını dileriz."]
 },
 dua:{
  open:["Rabbim bu mübarek vaktin rahmetinden hepimizi nasiplendirsin.","Allah gönüllerimizi iyiliğe ve samimi duaya açık eylesin.","Rabbim bu kıymetli gecede kalplerimize ferahlık ihsan eylesin."],
  mid:["Dertlerimize deva, gönüllerimize şifa, sıkıntılarımıza ferahlık nasip eylesin.","Bizi sevdiklerimizle birlikte sağlık, iman ve güzel ahlak üzere daim eylesin.","Dualarımızı hayırla karşılasın; iyiliği çoğaltmayı nasip etsin."],
  close:["Dualarımız hayra vesile olsun.","Rabbim gönüllerimizden geçen hayırlı duaları kabul eylesin.","Bu mübarek vakit hepimiz için hayırlara vesile olsun."]
 },
 kaynakli:{
  open:["“Şüphesiz zorlukla beraber bir kolaylık vardır.” (İnşirah, 94/6) Bu ilahi müjdeyi hatırladığımız bu özel vakitte gönüllerimizin umutla güçlenmesini diliyorum.","“Şüphesiz Allah sabredenlerle beraberdir.” (Bakara, 2/153) Bu mübarek günde sabrımızın ve teslimiyetimizin güçlenmesini diliyorum."],
  mid:["Güzel niyetlerin iyiliğe ve merhamete dönüşmesi en büyük temennimiz olsun.","Kalplerimizin iyilikte birleştiği, kardeşlik ve dayanışmanın güçlendiği günlere erişelim."],
  close:["Kandiliniz mübarek olsun.","Bu mübarek vakit hayırlara vesile olsun."]
 }
};

function fallbackVurgu(raw,style){
 if(!raw)return"";
 const clean=raw.replace(/\s+/g," ").trim().slice(0,180);
 const map={
  samimi:[`Özel olarak belirttiğiniz “${clean}” vurgusunun da bu mesajın anlamı içinde hayır ve güzellikle yer bulmasını gönülden diliyorum.`,`Gönlünüzde yer eden “${clean}” hassasiyetini de bu özel vaktin manevi iklimi içinde saygıyla anıyorum.`],
  resmi:[`Özel olarak belirttiğiniz “${clean}” hususunu da bu anlamlı gün vesilesiyle saygıyla ifade etmek isterim.`,`“${clean}” konusundaki hassasiyetinizin de mesajın manevi çerçevesi içinde karşılık bulmasını temenni ederim.`],
  kurumsal:[`Özel olarak belirtilen “${clean}” vurgusunu da bu mesajın anlam bütünlüğü içinde önemsiyoruz.`,`“${clean}” konusundaki hassasiyeti de ortak değerlerimiz çerçevesinde saygıyla karşılıyoruz.`],
  dua:[`Rabbim “${clean}” konusunda gönüllerde taşınan hayırlı niyetleri güzelliklere dönüştürsün.`,`“${clean}” ile ilgili hayırlı dilek ve dualarımızın güzel sonuçlara vesile olmasını niyaz ediyorum.`],
  kaynakli:[`Özel olarak belirtilen “${clean}” vurgusunun da bu manevi hatırlayış içinde anlamlı bir yer bulmasını diliyorum.`]
 };
 return pick(map[style]||map.samimi);
}

function localMessage(){
 const style=$("uslup").value,z=$("uzunluk").value,h=$("hitap").value.trim(),raw=$("anahtarKelime").value.trim(),im=$("imza").value.trim();
 const bank=fallbackBanks[style]||fallbackBanks.samimi,parts=[pick(bank.open)];
 const v=fallbackVurgu(raw,style);if(v)parts.push(v);
 if(z!=="kisa")parts.push(pick(bank.mid));
 if(z==="uzun")parts.push(pick(bank.mid));
 parts.push(pick(bank.close));
 let m=parts.filter(Boolean).join(" ").replace(/\s+/g," ").trim();
 if(h)m=h+",\n\n"+m;if(im)m+="\n\n"+im;return m;
}

function similarity(a,b){
 if(!a||!b)return 0;
 const norm=x=>new Set(x.toLocaleLowerCase("tr-TR").replace(/[^a-zçğıöşü0-9 ]/gi," ").split(/\s+/).filter(w=>w.length>3));
 const A=norm(a),B=norm(b);let hit=0;A.forEach(x=>{if(B.has(x))hit++});
 return hit/Math.max(1,Math.min(A.size,B.size));
}

function mesajOlustur(){
 const b=$("olusturBtn");b.disabled=true;b.textContent="⏳ Mesaj hazırlanıyor...";$("status").textContent="Mesaj hazırlanıyor...";
 const cb="mesajmatikCb_"+Date.now()+"_"+Math.floor(Math.random()*99999);let done=false,timer;
 const raw=$("anahtarKelime").value.trim();
 const cleanup=()=>{clearTimeout(timer);const s=document.getElementById(cb);if(s)s.remove();try{delete window[cb]}catch(e){}b.disabled=false;b.textContent="✨ Mesajı Oluştur"};
 const useFallback=detail=>{if(done)return;done=true;$("sonuc").value=localMessage();$("status").textContent="Mesaj oluşturuldu.";window.__mesajmatikDebug={engine:"fallback",detail:detail||"api_unavailable",time:new Date().toISOString()};cleanup()};
 window[cb]=data=>{if(done)return;const text=data&&data.text?String(data.text).trim():"";if(text.length>20){done=true;const sim=similarity(lastAiText,text);lastAiText=text;$("sonuc").value=text;$("status").textContent="Mesaj oluşturuldu.";window.__mesajmatikDebug={engine:"ai",detail:"similarity:"+sim.toFixed(2),time:new Date().toISOString()};cleanup()}else useFallback(data&&data.error?String(data.error):"empty_response")};
 const q=new URLSearchParams({callback:cb,gun:$("gunSecim").value,uslup:$("uslup").value,uzunluk:$("uzunluk").value,hitap:$("hitap").value,anahtar:raw,onceki:lastAiText.slice(0,1000),imza:$("imza").value.trim(),_:String(Date.now())});
 const s=document.createElement("script");s.id=cb;s.src=API_URL+"?"+q.toString();s.onerror=()=>useFallback("network_error");document.body.appendChild(s);timer=setTimeout(()=>useFallback("timeout"),9000);
}

async function kopyala(){if(!$("sonuc").value)return;try{await navigator.clipboard.writeText($("sonuc").value)}catch(e){$("sonuc").select();document.execCommand("copy")}$("status").textContent="Mesaj kopyalandı."}
function whatsapp(){if($("sonuc").value)window.open("https://wa.me/?text="+encodeURIComponent($("sonuc").value),"_blank")}

const dayStyles={
"Berat Kandili":{a:"#103e35",b:"#6a947e",g:"#d6b45a",sub:"Af ve rahmet gecesi"},
"Kadir Gecesi":{a:"#172c55",b:"#5f75a8",g:"#e0c575",sub:"Bin aydan hayırlı gece"},
"Mevlid Kandili":{a:"#315b48",b:"#8ba58f",g:"#d3b36a",sub:"Rahmet ve muhabbet"},
"Regaib Kandili":{a:"#513d67",b:"#9078a7",g:"#e1c68d",sub:"Rahmet ve bereket"},
"Miraç Kandili":{a:"#243f69",b:"#7090b4",g:"#d8bc6d",sub:"Manevi yükseliş"},
"Ramazan Bayramı":{a:"#1f6a58",b:"#82ad8e",g:"#efd07a",sub:"Sevinç ve kardeşlik"},
"Kurban Bayramı":{a:"#6a4a2d",b:"#a8865d",g:"#ead08b",sub:"Paylaşma ve teslimiyet"},
"Cuma Günü":{a:"#28594d",b:"#729484",g:"#d7bb74",sub:"Huzur ve bereket"},
"Ramazan Ayı":{a:"#294f63",b:"#6f99a8",g:"#e0c174",sub:"Rahmet ve bereket ayı"},
"Arefe Günü":{a:"#604d36",b:"#a28a68",g:"#e0c483",sub:"Dua ve hazırlık vakti"}
};
let vary=0;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}
function wrap(c,text,w){const words=text.replace(/\s+/g," ").trim().split(" "),lines=[];let line="";for(const q of words){const n=line?line+" "+q:q;if(c.measureText(n).width>w&&line){lines.push(line);line=q}else line=n}if(line)lines.push(line);return lines}
function drawBody(c,text,x,y,w,maxY){let size=30,lh=44,lines=[];do{c.font=size+"px Georgia";lines=wrap(c,text,w);if(y+lines.length*lh<=maxY)break;size-=1;lh-=1.15}while(size>20);c.fillStyle="#26352e";c.textAlign="left";for(const line of lines){if(y>maxY)break;c.fillText(line,x,y);y+=lh}}
function kartOlustur(change=false){
 if(!$("sonuc").value.trim())$("sonuc").value=localMessage();if(change)vary=(vary+1)%3;
 const cv=$("kartCanvas"),c=cv.getContext("2d"),gun=$("gunSecim").value,st=dayStyles[gun]||dayStyles["Cuma Günü"];cv.style.display="block";
 const gr=c.createLinearGradient(0,0,1080,1080);gr.addColorStop(0,st.a);gr.addColorStop(1,st.b);c.fillStyle=gr;c.fillRect(0,0,1080,1080);
 c.fillStyle="rgba(255,255,255,.95)";rr(c,70,70,940,940,34);c.fill();c.strokeStyle=st.g;c.lineWidth=4;c.stroke();
 c.fillStyle=st.a;c.textAlign="center";c.font="700 52px Georgia";c.fillText(gun,540,vary===1?250:235);c.fillStyle="#8b7645";c.font="italic 25px Georgia";c.fillText(st.sub,540,vary===1?292:278);
 c.strokeStyle=st.g;c.lineWidth=2;c.beginPath();c.moveTo(vary===2?220:300,315);c.lineTo(vary===2?860:780,315);c.stroke();
 const raw=$("sonuc").value.trim(),hit=$("hitap").value.trim(),im=$("imza").value.trim();let body=raw;if(hit&&body.startsWith(hit))body=body.slice(hit.length).replace(/^,?\s*/,"");if(im&&body.endsWith(im))body=body.slice(0,-im.length).trim();
 let y=390;if(hit){c.fillStyle=st.a;c.font="700 31px Arial";c.textAlign="left";c.fillText(hit+",",145,y);y+=55}drawBody(c,body,145,y,790,875);
 if(im){c.fillStyle=st.a;c.font="700 30px Georgia";c.textAlign="right";c.fillText(im,920,940)}c.textAlign="center";c.fillStyle="#8a8f8b";c.font="18px Arial";c.fillText("Mesajmatik",540,982);
}
function kartIndir(){if($("kartCanvas").style.display==="none")kartOlustur(false);const a=document.createElement("a");a.download="mesajmatik-kart.png";a.href=$("kartCanvas").toDataURL("image/png");a.click()}
async function kartPaylas(){if($("kartCanvas").style.display==="none")kartOlustur(false);$("kartCanvas").toBlob(async blob=>{if(!blob)return;const f=new File([blob],"mesajmatik-kart.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}else kartIndir()},"image/png")}
</script>
</body>
</html>
