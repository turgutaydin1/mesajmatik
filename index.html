<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mesajmatik</title>
<style>
:root{--y:#2f7d5a;--yk:#1f5d43;--a:#b9943f;--t:#26332c;--s:#6d7871}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eef5f0,#faf7ef);color:var(--t)}.wrap{max-width:780px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8e3;border-radius:22px;overflow:hidden;box-shadow:0 12px 34px #23452f18}header{text-align:center;padding:25px 18px;background:linear-gradient(135deg,#edf7f0,#fff9eb);border-bottom:1px solid #e7ece8}header .moon{font-size:34px}h1{margin:4px 0;color:var(--yk)}header p{margin:4px;color:var(--s);font-size:14px}.content{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}select,input,textarea{width:100%;padding:12px 13px;border:1px solid #ccd6cf;border-radius:11px;font-size:15px;background:#fff;color:#26332c}textarea{min-height:190px;line-height:1.55;resize:vertical}.mainbtn{width:100%;margin-top:14px;background:linear-gradient(135deg,#2f7d5a,#b9943f);color:#fff;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:900;cursor:pointer}.mainbtn:disabled{opacity:.65}.sec{margin-top:20px;padding-top:18px;border-top:1px dashed #d8dfda}.sec h3{margin:0 0 10px;color:var(--yk)}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}button{border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:800;cursor:pointer}.blue{background:#2f6da1;color:#fff}.soft{background:#e9f1eb;color:var(--yk)}.gold{background:#b68d2f;color:#fff}.green{background:var(--y);color:#fff}.status{min-height:20px;margin-top:9px;color:var(--yk);font-size:13px;font-weight:700}canvas{display:none;width:100%;height:auto;border-radius:16px;border:1px solid #dfe6e0}.note{font-size:12px;color:#758079;background:#f6f8f6;padding:10px;border-radius:9px;margin-top:10px;line-height:1.45}.footer{text-align:center;color:#828b86;font-size:12px;padding:0 18px 20px}@media(max-width:640px){.grid,.three{grid-template-columns:1fr}.wrap{padding:8px}.content{padding:14px}}
</style></head><body>
<div class="wrap"><div class="card"><header><div class="moon">🌙</div><h1>Mesajmatik</h1><p>Manevi günler için özgün mesaj ve paylaşım kartı oluşturucu</p></header><div class="content">
<div class="grid"><div><label>Özel Gün / Zaman</label><select id="gunSecim"><option>Berat Kandili</option><option>Kadir Gecesi</option><option>Mevlid Kandili</option><option>Regaib Kandili</option><option>Miraç Kandili</option><option>Ramazan Bayramı</option><option>Kurban Bayramı</option><option>Cuma Günü</option><option>Ramazan Ayı</option><option>Arefe Günü</option></select></div><div><label>Üslup</label><select id="uslup"><option value="samimi">Samimi</option><option value="resmi">Resmî</option><option value="kurumsal">Kurumsal</option><option value="dua">Dua ağırlıklı</option></select></div><div><label>Mesaj Uzunluğu</label><select id="uzunluk"><option value="kisa">Kısa</option><option value="orta" selected>Orta</option><option value="uzun">Uzun</option></select></div><div><label>Hitap</label><select id="hitap"><option value="">Hitap ekleme</option><option>Değerli Dostlarım</option><option>Kıymetli Dostlarım</option><option>Değerli Mesai Arkadaşlarım</option><option>Kıymetli Ailem</option><option>Değerli Çalışma Arkadaşlarımız</option></select></div><div class="full"><label>Özel Vurgu / Anahtar Kelimeler</label><input id="anahtarKelime" placeholder="Örn: Gazze, Doğu Türkistan, umut, çocuklar, sabır..."></div><div class="full"><label>İsim / Kurum / Şirket Adı</label><input id="imza" placeholder="Örn: Turgut Aydın"></div></div>
<button class="mainbtn" id="olusturBtn" onclick="mesajOlustur()">✨ Mesajı Oluştur</button>
<div class="sec"><h3>Oluşturulan Mesaj</h3><textarea id="sonuc" readonly placeholder="Mesajınız burada görünecek..."></textarea><div class="three"><button class="blue" onclick="kopyala()">📋 Kopyala</button><button class="soft" onclick="whatsapp()">🟢 WhatsApp</button><button class="gold" onclick="kartOlustur(false)">🖼️ Görsel Kart Oluştur</button></div><div class="status" id="status"></div></div>
<div class="sec"><h3>Paylaşım Kartı</h3><canvas id="kartCanvas" width="1080" height="1080"></canvas><div class="three"><button class="green" onclick="kartIndir()">⬇️ Görseli Kaydet</button><button class="soft" onclick="kartPaylas()">📤 Görseli Paylaş</button><button class="soft" onclick="kartOlustur(true)">🎨 Tasarımı Değiştir</button></div><div class="note">Her özel gün için farklı simge ve görsel dil kullanılır.</div></div></div><div class="footer">Mesajmatik</div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwZVpAEB4IYujc-yNL2mOLgHnV-t6i2OO32bWgV8r8OeeZeeMYJDh4r58_rfFXXLOTR/exec";const $=id=>document.getElementById(id),sec=a=>a[Math.floor(Math.random()*a.length)];
const acilis=["Bu kıymetli vakitte gönlünüzün huzurla dolmasını diliyorum","Bugünün manevi ikliminin kalbinize ferahlık getirmesini temenni ediyorum","Rahmet ve iyilik duygularının gönüllerimizde çoğaldığı bu özel zamanda","Kalplerimizi birbirimize yaklaştıran bu güzel vakitte","Maneviyatın, merhametin ve umudun daha derinden hissedildiği bu günde"];const dilek=["sağlık, huzur ve bereketin hanenizden eksik olmamasını diliyorum","sevdiklerinizle birlikte hayırlı, huzurlu ve güzel günlere erişmenizi temenni ediyorum","gönlünüzde taşıdığınız güzel niyetlerin hayra dönüşmesini diliyorum","evlerinize bereket, kalplerinize ferahlık ve hayatınıza güzellikler getirmesini diliyorum"];const dualar=["Dualarınızın kabulüne ve gönlünüzün ferahlığına vesile olsun.","Rabbim gönüllerimizi merhamet, sabır ve iyilikten ayırmasın.","Bu güzel vaktin hayatımıza hayır ve huzur katmasını diliyorum.","Kalplerimizdeki iyi niyetlerin çoğalmasına vesile olsun."];
function kapanis(g){if(g==="Cuma Günü")return"Cumanız mübarek olsun.";if(g.includes("Kandili"))return"Kandiliniz mübarek olsun.";if(g.includes("Gecesi"))return"Geceniz mübarek olsun.";if(g.includes("Bayramı"))return"Bayramınız mübarek olsun.";if(g==="Ramazan Ayı")return"Ramazan-ı Şerifiniz mübarek olsun.";if(g==="Arefe Günü")return"Arefe gününüz mübarek olsun.";return"Bu güzel vaktiniz hayırlara vesile olsun."}
function anahtarYorumla(raw){if(!raw)return"";const x=raw.toLocaleLowerCase("tr-TR"),not=[];not.push("Kullanıcının anahtar kelimelerini liste halinde tekrar etme; önce anlamlarını ve aralarındaki ilişkiyi yorumla, sonra doğal biçimde metne yedir.");if(x.includes("gazze"))not.push("Gazze'yi savaş ve mağduriyet yaşayan insanların huzur, güvenlik, selamet ve adalet özlemi bağlamında işle; sadece 'Gazze için dua' gibi yüzeysel bir ifade kullanma.");if(x.includes("doğu türkistan"))not.push("Doğu Türkistan'ı inanç, kimlik, huzur ve özgürlük özlemi yaşayan kardeşlerimizin durumu bağlamında zarifçe işle; kelimeyi mekanik biçimde tekrarlama.");if(x.includes("çocuk"))not.push("Çocukları masumiyet, güvenli bir gelecek, korkudan uzak büyüme ve umut bağlamında işle.");if(x.includes("umut"))not.push("Umudu doğrudan bir anahtar kelime gibi sayma; metnin duygusuna, geleceğe dair inanca ve ferahlık beklentisine dönüştür.");if(x.includes("sabır"))not.push("Sabrı zorluklar karşısında metanet, direnç ve manevi dayanıklılık bağlamında kullan; kelimeyi zorunlu olarak aynen tekrar etme.");if(x.includes("birlik")||x.includes("kardeş"))not.push("Birlik ve kardeşlik vurgusunu dayanışma, gönül bağı ve ortak dua duygusuna dönüştür.");not.push("Kullanıcının verdiği ham kelimeler: "+raw+". Bunları aynen sıralamak zorunda değilsin; anlamlarını doğru bağlamda yorumla.");return not.join(" ")}
function yerelMesaj(){const g=$("gunSecim").value,u=$("uslup").value,z=$("uzunluk").value,h=$("hitap").value,a=$("anahtarKelime").value.trim(),i=$("imza").value.trim();let m=sec(acilis)+"; "+sec(dilek)+".";const x=a.toLocaleLowerCase("tr-TR");if(x.includes("gazze")||x.includes("doğu türkistan")||x.includes("mazlum"))m+=" Başta zulüm ve sıkıntı içindeki kardeşlerimiz olmak üzere, mazlum coğrafyalarda yaşayan insanların huzur, güven ve selamete kavuşmasını gönülden diliyorum.";if(x.includes("çocuk"))m+=" Masum çocukların korkudan uzak, güven ve umut içinde büyüyebileceği yarınların çoğalmasını temenni ediyorum.";if(x.includes("umut")||x.includes("sabır"))m+=" En zor zamanlarda dahi umudumuzu koruyacak metaneti ve sabrı kaybetmemeyi diliyorum.";if(z!=="kisa")m+=" "+sec(dualar);if(z==="uzun")m+=" Sevgi, kardeşlik, paylaşma ve merhamet duygularımızın güçlenmesine vesile olmasını temenni ediyorum.";m+=" "+kapanis(g);if(u==="resmi")m=m.replaceAll("diliyorum","temenni ederim");if(u==="kurumsal")m=m.replaceAll("diliyorum","temenni ediyoruz");m=(h?h+",\n\n":"")+m;if(i)m+="\n\n"+i;return m}
function mesajOlustur(){const b=$("olusturBtn");b.disabled=true;b.textContent="⏳ Mesaj hazırlanıyor...";$("status").textContent="";const cb="mesajmatikCb_"+Date.now()+"_"+Math.floor(Math.random()*9999);let done=false;const cleanup=()=>{const s=document.getElementById(cb);if(s)s.remove();try{delete window[cb]}catch(e){}b.disabled=false;b.textContent="✨ Mesajı Oluştur"};const fallback=()=>{if(done)return;done=true;$("sonuc").value=yerelMesaj();$("status").textContent="Mesaj oluşturuldu.";cleanup()};window[cb]=data=>{if(done)return;done=true;if(data&&data.text){$("sonuc").value=String(data.text).trim();$("status").textContent="Mesaj oluşturuldu."}else{$("sonuc").value=yerelMesaj();$("status").textContent="Mesaj oluşturuldu."}cleanup()};const q=new URLSearchParams({callback:cb,gun:$("gunSecim").value,uslup:$("uslup").value,uzunluk:$("uzunluk").value,hitap:$("hitap").value,anahtar:anahtarYorumla($("anahtarKelime").value.trim()),imza:$("imza").value.trim(),_:String(Date.now())});const s=document.createElement("script");s.id=cb;s.src=API_URL+"?"+q.toString();s.onerror=fallback;document.body.appendChild(s);setTimeout(fallback,20000)}
async function kopyala(){if(!$("sonuc").value)return;try{await navigator.clipboard.writeText($("sonuc").value)}catch(e){$("sonuc").select();document.execCommand("copy")}$("status").textContent="Mesaj kopyalandı."}function whatsapp(){if($("sonuc").value)window.open("https://wa.me/?text="+encodeURIComponent($("sonuc").value),"_blank")}
const dayStyle={"Berat Kandili":{c1:"#0f3f35",c2:"#5f8f76",gold:"#d6b45a",icon:"stars",sub:"Af ve rahmet gecesi"},"Kadir Gecesi":{c1:"#172c55",c2:"#5c6fa3",gold:"#e0c575",icon:"lantern",sub:"Bin aydan hayırlı gece"},"Mevlid Kandili":{c1:"#315b48",c2:"#8ba58f",gold:"#d3b36a",icon:"dome",sub:"Rahmet ve muhabbet"},"Regaib Kandili":{c1:"#513d67",c2:"#8f78a6",gold:"#e1c68d",icon:"starcrescent",sub:"Rahmet ve bereket"},"Miraç Kandili":{c1:"#243f69",c2:"#7090b4",gold:"#d8bc6d",icon:"ascend",sub:"Manevi yükseliş"},"Ramazan Bayramı":{c1:"#1f6a58",c2:"#82ad8e",gold:"#efd07a",icon:"gift",sub:"Sevinç ve kardeşlik"},"Kurban Bayramı":{c1:"#6a4a2d",c2:"#a8865d",gold:"#ead08b",icon:"kaaba",sub:"Paylaşma ve teslimiyet"},"Cuma Günü":{c1:"#28594d",c2:"#729484",gold:"#d7bb74",icon:"mosque",sub:"Huzur ve bereket"},"Ramazan Ayı":{c1:"#294f63",c2:"#6f99a8",gold:"#e0c174",icon:"lantern2",sub:"Rahmet ve bereket ayı"},"Arefe Günü":{c1:"#604d36",c2:"#a28a68",gold:"#e0c483",icon:"beads",sub:"Dua ve hazırlık vakti"}};let vary=0;
function rr(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}function star(ctx,x,y,r){ctx.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rad=i%2===0?r:r*.42,px=x+Math.cos(a)*rad,py=y+Math.sin(a)*rad;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}ctx.closePath();ctx.fill()}function crescent(ctx,x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fill();ctx.save();ctx.globalCompositeOperation="destination-out";ctx.beginPath();ctx.arc(x+r*.34,y-r*.08,r*.82,0,Math.PI*2);ctx.fill();ctx.restore()}
function drawIcon(ctx,type,x,y,s,color){ctx.save();ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=8;ctx.lineCap="round";ctx.lineJoin="round";if(type==="stars"){crescent(ctx,x-12,y,s*.34);star(ctx,x+48,y-34,s*.12);star(ctx,x+60,y+20,s*.08);star(ctx,x+18,y+54,s*.06)}else if(type==="lantern"||type==="lantern2"){ctx.strokeRect(x-s*.22,y-s*.28,s*.44,s*.56);ctx.beginPath();ctx.moveTo(x-s*.12,y-s*.4);ctx.lineTo(x+s*.12,y-s*.4);ctx.moveTo(x,y-s*.4);ctx.lineTo(x,y-s*.52);ctx.stroke();star(ctx,x,y+s*.08,s*.08)}else if(type==="dome"||type==="mosque"){ctx.beginPath();ctx.arc(x,y,s*.34,Math.PI,0);ctx.lineTo(x+s*.34,y+s*.27);ctx.lineTo(x-s*.34,y+s*.27);ctx.closePath();ctx.fill();ctx.fillRect(x-s*.42,y+s*.27,s*.84,s*.13);ctx.fillRect(x-s*.5,y-s*.03,s*.09,s*.43);ctx.fillRect(x+s*.41,y-s*.03,s*.09,s*.43)}else if(type==="starcrescent"){crescent(ctx,x-18,y,s*.32);star(ctx,x+50,y,s*.16)}else if(type==="ascend"){for(let i=0;i<4;i++){ctx.globalAlpha=.35+i*.18;star(ctx,x-52+i*32,y+45-i*34,s*(.05+i*.025))}ctx.globalAlpha=1;star(ctx,x+58,y-64,s*.14)}else if(type==="gift"){ctx.fillRect(x-s*.32,y-s*.08,s*.64,s*.45);ctx.fillRect(x-s*.38,y-s*.2,s*.76,s*.15);ctx.fillRect(x-s*.04,y-s*.2,s*.08,s*.57)}else if(type==="kaaba"){ctx.fillRect(x-s*.34,y-s*.32,s*.68,s*.64);ctx.fillStyle="#e1c06a";ctx.fillRect(x-s*.34,y-s*.08,s*.68,s*.08)}else if(type==="beads"){ctx.lineWidth=5;ctx.beginPath();ctx.arc(x,y,s*.34,0,Math.PI*1.65);ctx.stroke();for(let i=0;i<12;i++){const a=.2+i*.42;ctx.beginPath();ctx.arc(x+Math.cos(a)*s*.34,y+Math.sin(a)*s*.34,s*.035,0,Math.PI*2);ctx.fill()}}ctx.restore()}
function wrap(ctx,text,w){const words=text.replace(/\s+/g," ").trim().split(" "),lines=[];let line="";for(const word of words){const t=line?line+" "+word:word;if(ctx.measureText(t).width>w&&line){lines.push(line);line=word}else line=t}if(line)lines.push(line);return lines}function justify(ctx,line,x,y,w,last){const a=line.split(" ");ctx.textAlign="left";if(last||a.length<2){ctx.fillText(line,x,y);return}const tw=a.reduce((n,q)=>n+ctx.measureText(q).width,0),gap=(w-tw)/(a.length-1);let cx=x;for(const q of a){ctx.fillText(q,cx,y);cx+=ctx.measureText(q).width+gap}}
function kartOlustur(change=false){if(!$("sonuc").value.trim())$("sonuc").value=yerelMesaj();if(change)vary=(vary+1)%3;const c=$("kartCanvas"),ctx=c.getContext("2d"),gun=$("gunSecim").value,st=dayStyle[gun]||dayStyle["Cuma Günü"];c.style.display="block";const grad=ctx.createLinearGradient(0,0,1080,1080);grad.addColorStop(0,st.c1);grad.addColorStop(1,st.c2);ctx.fillStyle=grad;ctx.fillRect(0,0,1080,1080);ctx.save();ctx.globalAlpha=.1;ctx.fillStyle="#fff";for(let y=90;y<1080;y+=120)for(let x=70+(y/120%2)*40;x<1080;x+=140)star(ctx,x,y,11+vary*2);ctx.restore();ctx.fillStyle="rgba(255,255,255,.94)";rr(ctx,70,70,940,940,34);ctx.fill();ctx.strokeStyle=st.gold;ctx.lineWidth=4;ctx.stroke();ctx.fillStyle=st.c1;rr(ctx,390,105,300,165,28);ctx.fill();drawIcon(ctx,st.icon,540,178,135,"#f7e5a8");ctx.textAlign="center";ctx.fillStyle=st.c1;ctx.font="700 48px Georgia";ctx.fillText(gun,540,335);ctx.fillStyle="#8b7645";ctx.font="italic 25px Georgia";ctx.fillText(st.sub,540,374);ctx.strokeStyle=st.gold;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(310,402);ctx.lineTo(770,402);ctx.stroke();const raw=$("sonuc").value.trim(),hit=$("hitap").value.trim(),im=$("imza").value.trim();let body=raw;if(hit&&body.startsWith(hit))body=body.slice(hit.length).replace(/^,?\s*/,"");if(im&&body.endsWith(im))body=body.slice(0,-im.length).trim();const x=145,w=790;let y=465;ctx.fillStyle="#26352e";if(hit){ctx.font="700 31px Arial";ctx.textAlign="left";ctx.fillText(hit+",",x,y);y+=58}ctx.font="29px Georgia";const ls=wrap(ctx,body,w),lh=43;for(let i=0;i<ls.length;i++){if(y>875)break;justify(ctx,ls[i],x,y,w,i===ls.length-1);y+=lh}if(im){ctx.fillStyle=st.c1;ctx.font="700 30px Georgia";ctx.textAlign="right";ctx.fillText(im,920,935)}ctx.textAlign="center";ctx.fillStyle="#8a8f8b";ctx.font="18px Arial";ctx.fillText("Mesajmatik",540,980)}
function kartIndir(){if($("kartCanvas").style.display==="none")kartOlustur(false);const a=document.createElement("a");a.download="mesajmatik-kart.png";a.href=$("kartCanvas").toDataURL("image/png");a.click()}async function kartPaylas(){if($("kartCanvas").style.display==="none")kartOlustur(false);$("kartCanvas").toBlob(async blob=>{if(!blob)return;const f=new File([blob],"mesajmatik-kart.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}else kartIndir()},"image/png")}
</script></body></html>
