<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Mesajmatik</title>
<style>
:root{--y:#2f7d5a;--yk:#1f5d43;--a:#b9943f;--t:#26332c;--s:#6d7871}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eef5f0,#faf7ef);color:var(--t)}.wrap{max-width:780px;margin:auto;padding:14px}.card{background:#fff;border:1px solid #e2e8e3;border-radius:22px;overflow:hidden;box-shadow:0 12px 34px #23452f18}header{text-align:center;padding:25px 18px;background:linear-gradient(135deg,#edf7f0,#fff9eb);border-bottom:1px solid #e7ece8}header .moon{font-size:34px}h1{margin:4px 0;color:var(--yk)}header p{margin:4px;color:var(--s);font-size:14px}.content{padding:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;font-size:13px;font-weight:800;margin:0 0 6px}select,input,textarea{width:100%;padding:12px 13px;border:1px solid #ccd6cf;border-radius:11px;font-size:15px;background:#fff;color:#26332c}textarea{min-height:190px;line-height:1.55;resize:vertical}.mainbtn{width:100%;margin-top:14px;background:linear-gradient(135deg,#2f7d5a,#b9943f);color:#fff;border:0;border-radius:12px;padding:15px;font-size:16px;font-weight:900;cursor:pointer}.mainbtn:disabled{opacity:.65}.sec{margin-top:20px;padding-top:18px;border-top:1px dashed #d8dfda}.sec h3{margin:0 0 10px;color:var(--yk)}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}button{border:0;border-radius:10px;padding:13px;font-size:14px;font-weight:800;cursor:pointer}.blue{background:#2f6da1;color:#fff}.soft{background:#e9f1eb;color:var(--yk)}.gold{background:#b68d2f;color:#fff}.green{background:var(--y);color:#fff}.status{min-height:20px;margin-top:9px;color:var(--yk);font-size:13px;font-weight:700}canvas{display:none;width:100%;height:auto;border-radius:16px;border:1px solid #dfe6e0}.note{font-size:12px;color:#758079;background:#f6f8f6;padding:10px;border-radius:9px;margin-top:10px;line-height:1.45}.footer{text-align:center;color:#828b86;font-size:12px;padding:0 18px 20px}@media(max-width:640px){.grid,.three{grid-template-columns:1fr}.wrap{padding:8px}.content{padding:14px}}
</style></head><body>
<div class="wrap"><div class="card"><header><div class="moon">🌙</div><h1>Mesajmatik</h1><p>Manevi günler için özgün mesaj ve paylaşım kartı oluşturucu</p></header><div class="content">
<div class="grid"><div><label>Özel Gün / Zaman</label><select id="gunSecim"><option>Berat Kandili</option><option>Kadir Gecesi</option><option>Mevlid Kandili</option><option>Regaib Kandili</option><option>Miraç Kandili</option><option>Ramazan Bayramı</option><option>Kurban Bayramı</option><option>Cuma Günü</option><option>Ramazan Ayı</option><option>Arefe Günü</option></select></div><div><label>Üslup</label><select id="uslup"><option value="samimi">Samimi</option><option value="resmi">Resmî</option><option value="kurumsal">Kurumsal</option><option value="dua">Dua ağırlıklı</option></select></div><div><label>Mesaj Uzunluğu</label><select id="uzunluk"><option value="kisa">Kısa</option><option value="orta" selected>Orta</option><option value="uzun">Uzun</option></select></div><div><label>Hitap</label><select id="hitap"><option value="">Hitap ekleme</option><option>Değerli Dostlarım</option><option>Kıymetli Dostlarım</option><option>Değerli Mesai Arkadaşlarım</option><option>Kıymetli Ailem</option><option>Değerli Çalışma Arkadaşlarımız</option></select></div><div class="full"><label>Özel Vurgu / Anahtar Kelimeler</label><input id="anahtarKelime"></div><div class="full"><label>İsim / Kurum / Şirket Adı</label><input id="imza"></div></div>
<button class="mainbtn" id="olusturBtn" onclick="mesajOlustur()">✨ Mesajı Oluştur</button>
<div class="sec"><h3>Oluşturulan Mesaj</h3><textarea id="sonuc" readonly placeholder="Mesajınız burada görünecek..."></textarea><div class="three"><button class="blue" onclick="kopyala()">📋 Kopyala</button><button class="soft" onclick="whatsapp()">🟢 WhatsApp</button><button class="gold" onclick="kartOlustur(false)">🖼️ Görsel Kart Oluştur</button></div><div class="status" id="status"></div></div>
<div class="sec"><h3>Paylaşım Kartı</h3><canvas id="kartCanvas" width="1080" height="1080"></canvas><div class="three"><button class="green" onclick="kartIndir()">⬇️ Görseli Kaydet</button><button class="soft" onclick="kartPaylas()">📤 Görseli Paylaş</button><button class="soft" onclick="kartOlustur(true)">🎨 Tasarımı Değiştir</button></div><div class="note">Her özel gün için farklı simge ve görsel dil kullanılır.</div></div></div><div class="footer">Mesajmatik</div></div></div>
<script>
const API_URL="https://script.google.com/macros/s/AKfycbwZVpAEB4IYujc-yNL2mOLgHnV-t6i2OO32bWgV8r8OeeZeeMYJDh4r58_rfFXXLOTR/exec";
const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)];
const openers=["Bu mübarek vaktin gönüllerimize huzur ve ferahlık getirmesini diliyorum","Maneviyatın kalplerimizi birbirine yaklaştırdığı bu özel zamanda","Rahmet, merhamet ve umudun daha derinden hissedildiği bu güzel vakitte","Gönüllerin duaya, iyiliğe ve kardeşliğe yöneldiği bu anlamlı günde","Bugünün manevi ikliminin kalplerimizde güzel izler bırakmasını temenni ediyorum","Bu kıymetli zamanın hayatımıza hayır, gönlümüze huzur katmasını diliyorum"];
const wishes=["sağlık, huzur ve bereketin hayatınızdan eksik olmamasını diliyorum","sevdiklerinizle birlikte hayırlı ve güzel günlere erişmenizi temenni ediyorum","güzel niyetlerinizin hayra, dualarınızın gönül ferahlığına vesile olmasını diliyorum","evlerinize bereket, kalplerinize huzur ve hayatınıza güzellikler getirmesini temenni ediyorum","iyiliğin, merhametin ve dayanışmanın çoğaldığı günlere erişmeyi diliyorum"];
const prayers=["Rabbim gönüllerimizi iyilikten, merhametten ve güzel niyetlerden ayırmasın.","Dualarımızın kabulüne, gönüllerimizin ferahlığına vesile olsun.","Bu güzel vaktin affa, rahmete ve hayırlı başlangıçlara vesile olmasını diliyorum.","Rabbim sevdiklerimizle birlikte sağlık, huzur ve hayır üzere yaşamayı nasip etsin.","Kalplerimizdeki ümidi, sabrı ve kardeşlik duygusunu güçlendirsin."];
const longers=["Kırgınlıkların yerini muhabbetin, yalnızlığın yerini dayanışmanın almasına vesile olsun.","Paylaşmanın, hoşgörünün ve gönül birliğinin hayatımızda daha fazla yer bulmasını temenni ediyorum.","Her birimizin çevresine daha fazla iyilik, anlayış ve merhamet taşıyabildiği günlere vesile olsun."];
function closing(g){if(g==="Cuma Günü")return pick(["Cumanız mübarek olsun.","Hayırlı Cumalar diliyorum.","Cumanız huzur ve berekete vesile olsun."]);if(g.includes("Kandili"))return pick(["Kandiliniz mübarek olsun.","Bu mübarek kandilin hayırlara vesile olmasını diliyorum.","Kandil geceniz huzur ve bereketle dolsun."]);if(g.includes("Gecesi"))return pick(["Geceniz mübarek olsun.","Bu mübarek gecenin hayırlara vesile olmasını diliyorum.","Geceniz rahmet ve huzurla dolsun."]);if(g.includes("Bayramı"))return pick(["Bayramınız mübarek olsun.","Huzurlu ve bereketli bir bayram diliyorum.","Bayram sevinciniz daim olsun."]);if(g==="Ramazan Ayı")return pick(["Ramazan-ı Şerifiniz mübarek olsun.","Ramazan ayınız hayırlara vesile olsun."]);if(g==="Arefe Günü")return pick(["Arefe gününüz mübarek olsun.","Arefe gününüz hayırlara vesile olsun."]);return"Bu güzel vaktiniz hayırlara vesile olsun."}
function namedTerms(raw){if(!raw)return[];const known=["gazze","doğu türkistan","filistin","kudüs","mekke","medine","suriye","yemen","arakan"];return raw.split(/[,;]+/).map(x=>x.trim()).filter(Boolean).filter(t=>known.includes(t.toLocaleLowerCase("tr-TR")))}
function fallbackContext(raw){const names=namedTerms(raw);if(!names.length)return"";const joined=names.length===1?names[0]:names.slice(0,-1).join(", ")+" ve "+names[names.length-1];return" "+pick([joined+" başta olmak üzere gönlümüzde yer eden mazlum coğrafyalar için huzur, güven ve selamet diliyorum.","Dualarımızda "+joined+"’yi de anıyor; oralarda yaşayan insanların huzura ve güvenli günlere kavuşmasını temenni ediyorum.",joined+" için gönülden hayır, huzur ve ferahlık diliyorum."])}
function yerelMesaj(){const g=$("gunSecim").value,u=$("uslup").value,z=$("uzunluk").value,h=$("hitap").value,a=$("anahtarKelime").value.trim(),i=$("imza").value.trim();let m=pick(openers)+"; "+pick(wishes)+"."+fallbackContext(a);if(z!=="kisa")m+=" "+pick(prayers);if(z==="uzun")m+=" "+pick(longers);m+=" "+closing(g);if(u==="resmi")m=m.replaceAll("diliyorum","temenni ederim").replaceAll("diliyoruz","temenni ederiz");if(u==="kurumsal")m=m.replaceAll("diliyorum","temenni ediyoruz").replaceAll("temenni ediyorum","temenni ediyoruz");if(u==="dua")m=m.replace("Bu mübarek vaktin","Rabbim bu mübarek vaktin");m=(h?h+",\n\n":"")+m;if(i)m+="\n\n"+i;return m}
let lastAiText="";
function geminiInput(raw){if(!raw)return"";const names=namedTerms(raw);let inst="Kullanıcının verdiği ifadeler: "+raw+". Bunları virgüllü bir liste gibi cümleye taşıma ve 'X, Y, Z için dua' biçimi kurma. Anlamlarını ve aralarındaki bağları kendin çözümle. Duygu ve tema bildiren sözcükleri doğal biçimde metne yedir; hepsini aynen kullanmak zorunda değilsin.";if(names.length)inst+=" Ancak şu özel adlar/yer adları mesajın içinde açıkça ve aynen geçmek zorundadır: "+names.join(", ")+". Bu adları atlama veya genel bir ifadeyle değiştirme.";if(lastAiText)inst+=" Önceki mesajın anlatımını tekrar etme; giriş, vurgu sırası ve cümle yapısını belirgin biçimde değiştir.";return inst.slice(0,295)}
function mesajOlustur(){const b=$("olusturBtn");b.disabled=true;b.textContent="⏳ Mesaj hazırlanıyor...";$("status").textContent="";const cb="mesajmatikCb_"+Date.now()+"_"+Math.floor(Math.random()*99999);let done=false;const cleanup=()=>{const s=document.getElementById(cb);if(s)s.remove();try{delete window[cb]}catch(e){}b.disabled=false;b.textContent="✨ Mesajı Oluştur"};const useFallback=()=>{if(done)return;done=true;$("sonuc").value=yerelMesaj();$("status").textContent="Mesaj oluşturuldu.";cleanup()};window[cb]=data=>{if(done)return;if(data&&data.text&&String(data.text).trim().length>20){done=true;lastAiText=String(data.text).trim();$("sonuc").value=lastAiText;$("status").textContent="Mesaj oluşturuldu.";cleanup()}else useFallback()};const q=new URLSearchParams({callback:cb,gun:$("gunSecim").value,uslup:$("uslup").value,uzunluk:$("uzunluk").value,hitap:$("hitap").value,anahtar:geminiInput($("anahtarKelime").value.trim()),imza:$("imza").value.trim(),_:String(Date.now())});const s=document.createElement("script");s.id=cb;s.src=API_URL+"?"+q.toString();s.onerror=useFallback;document.body.appendChild(s);setTimeout(useFallback,20000)}
async function kopyala(){if(!$("sonuc").value)return;try{await navigator.clipboard.writeText($("sonuc").value)}catch(e){$("sonuc").select();document.execCommand("copy")}$("status").textContent="Mesaj kopyalandı."}function whatsapp(){if($("sonuc").value)window.open("https://wa.me/?text="+encodeURIComponent($("sonuc").value),"_blank")}
const styles={"Berat Kandili":{a:"#103e35",b:"#6a947e",g:"#d6b45a",i:"☾✦",s:"Af ve rahmet gecesi"},"Kadir Gecesi":{a:"#172c55",b:"#5f75a8",g:"#e0c575",i:"🏮",s:"Bin aydan hayırlı gece"},"Mevlid Kandili":{a:"#315b48",b:"#8ba58f",g:"#d3b36a",i:"🕌",s:"Rahmet ve muhabbet"},"Regaib Kandili":{a:"#513d67",b:"#9078a7",g:"#e1c68d",i:"☾★",s:"Rahmet ve bereket"},"Miraç Kandili":{a:"#243f69",b:"#7090b4",g:"#d8bc6d",i:"✦↑",s:"Manevi yükseliş"},"Ramazan Bayramı":{a:"#1f6a58",b:"#82ad8e",g:"#efd07a",i:"🎁",s:"Sevinç ve kardeşlik"},"Kurban Bayramı":{a:"#6a4a2d",b:"#a8865d",g:"#ead08b",i:"🕋",s:"Paylaşma ve teslimiyet"},"Cuma Günü":{a:"#28594d",b:"#729484",g:"#d7bb74",i:"🕌",s:"Huzur ve bereket"},"Ramazan Ayı":{a:"#294f63",b:"#6f99a8",g:"#e0c174",i:"🏮☾",s:"Rahmet ve bereket ayı"},"Arefe Günü":{a:"#604d36",b:"#a28a68",g:"#e0c483",i:"📿",s:"Dua ve hazırlık vakti"}};let vary=0;
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}function wrap(c,t,w){const ws=t.replace(/\s+/g," ").trim().split(" "),ls=[];let l="";for(const q of ws){const n=l?l+" "+q:q;if(c.measureText(n).width>w&&l){ls.push(l);l=q}else l=n}if(l)ls.push(l);return ls}function justify(c,l,x,y,w,last){const a=l.split(" ");c.textAlign="left";if(last||a.length<2){c.fillText(l,x,y);return}const tw=a.reduce((n,q)=>n+c.measureText(q).width,0),gap=(w-tw)/(a.length-1);let cx=x;for(const q of a){c.fillText(q,cx,y);cx+=c.measureText(q).width+gap}}
function kartOlustur(change=false){if(!$("sonuc").value.trim())$("sonuc").value=yerelMesaj();if(change)vary=(vary+1)%3;const c=$("kartCanvas"),ctx=c.getContext("2d"),gun=$("gunSecim").value,st=styles[gun]||styles["Cuma Günü"];c.style.display="block";const gr=ctx.createLinearGradient(0,0,1080,1080);gr.addColorStop(0,st.a);gr.addColorStop(1,st.b);ctx.fillStyle=gr;ctx.fillRect(0,0,1080,1080);ctx.fillStyle="rgba(255,255,255,.95)";rr(ctx,70,70,940,940,34);ctx.fill();ctx.strokeStyle=st.g;ctx.lineWidth=4;ctx.stroke();ctx.fillStyle=st.a;rr(ctx,390,105,300,165,28);ctx.fill();ctx.textAlign="center";ctx.fillStyle="#f7e5a8";ctx.font=(vary===1?"66px":"72px")+" serif";ctx.fillText(st.i,540,210);ctx.fillStyle=st.a;ctx.font="700 48px Georgia";ctx.fillText(gun,540,335);ctx.fillStyle="#8b7645";ctx.font="italic 25px Georgia";ctx.fillText(st.s,540,374);ctx.strokeStyle=st.g;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(310,402);ctx.lineTo(770,402);ctx.stroke();const raw=$("sonuc").value.trim(),hit=$("hitap").value.trim(),im=$("imza").value.trim();let body=raw;if(hit&&body.startsWith(hit))body=body.slice(hit.length).replace(/^,?\s*/,"");if(im&&body.endsWith(im))body=body.slice(0,-im.length).trim();const x=145,w=790;let y=465;ctx.fillStyle="#26352e";if(hit){ctx.font="700 31px Arial";ctx.textAlign="left";ctx.fillText(hit+",",x,y);y+=58}ctx.font="29px Georgia";const ls=wrap(ctx,body,w),lh=43;for(let i=0;i<ls.length&&y<=875;i++){justify(ctx,ls[i],x,y,w,i===ls.length-1);y+=lh}if(im){ctx.fillStyle=st.a;ctx.font="700 30px Georgia";ctx.textAlign="right";ctx.fillText(im,920,935)}ctx.textAlign="center";ctx.fillStyle="#8a8f8b";ctx.font="18px Arial";ctx.fillText("Mesajmatik",540,980)}
function kartIndir(){if($("kartCanvas").style.display==="none")kartOlustur(false);const a=document.createElement("a");a.download="mesajmatik-kart.png";a.href=$("kartCanvas").toDataURL("image/png");a.click()}async function kartPaylas(){if($("kartCanvas").style.display==="none")kartOlustur(false);$("kartCanvas").toBlob(async blob=>{if(!blob)return;const f=new File([blob],"mesajmatik-kart.png",{type:"image/png"});if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f]})}catch(e){}}else kartIndir()},"image/png")}
</script></body></html>
