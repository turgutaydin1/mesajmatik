<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mesajmatik - Manevi Mesaj Oluşturucu</title>
<style>
:root{--yesil:#2f7d5a;--yesil2:#1f5d43;--altin:#c5a24d;--yazi:#26332c;--soluk:#6b766f}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:linear-gradient(180deg,#eef5f0 0%,#f7f5ef 100%);color:var(--yazi)}
.wrap{max-width:760px;margin:0 auto;padding:18px}.box{background:rgba(255,255,255,.96);border:1px solid #e2e8e3;border-radius:18px;box-shadow:0 10px 30px rgba(34,65,47,.10);overflow:hidden}
.header{padding:24px 22px 18px;text-align:center;background:linear-gradient(135deg,#edf7f0,#fffaf0);border-bottom:1px solid #e7ece8}.logo{font-size:34px}h1{margin:6px 0 4px;font-size:28px;color:var(--yesil2)}.sub{margin:0;color:var(--soluk);font-size:14px}
.content{padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.full{grid-column:1/-1}label{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:#3c4a42}
select,input,textarea{width:100%;border:1px solid #ccd6cf;border-radius:10px;padding:12px 13px;font-size:15px;background:#fff;color:#27332c;outline:none;transition:.2s}select:focus,input:focus,textarea:focus{border-color:var(--yesil);box-shadow:0 0 0 3px rgba(47,125,90,.10)}
textarea{min-height:170px;resize:vertical;line-height:1.5;background:#fbfcfb}.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}button{border:none;border-radius:10px;padding:13px 14px;font-size:15px;font-weight:800;cursor:pointer;transition:.2s}.primary{background:var(--yesil);color:#fff}.primary:hover{background:var(--yesil2)}.secondary{background:#eaf2ed;color:var(--yesil2)}.blue{background:#2f6da1;color:#fff}.gold{background:#b68d2f;color:#fff}
.smallnote{font-size:12px;color:#718078;margin-top:8px;line-height:1.45;background:#f6f8f6;border-radius:9px;padding:10px 12px}.preview{margin-top:18px;border-top:1px dashed #d8dfda;padding-top:18px}.preview h3{margin:0 0 10px;color:var(--yesil2)}canvas{width:100%;height:auto;border-radius:14px;border:1px solid #dfe6e0;background:#f4f1e8;display:none}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-top:10px}.status{margin-top:10px;font-size:13px;font-weight:700;color:var(--yesil2);min-height:20px}.footer{text-align:center;padding:0 20px 22px;color:#7a857e;font-size:12px}
@media(max-width:640px){.wrap{padding:10px}.content{padding:16px}.grid,.btnrow,.actions{grid-template-columns:1fr}h1{font-size:24px}}
</style>
</head>
<body>
<div class="wrap"><div class="box">
<div class="header"><div class="logo">🌙</div><h1>Mesajmatik</h1><p class="sub">Manevi günler için özgün mesaj ve paylaşım kartı oluşturucu</p></div>
<div class="content">
<div class="grid">
<div><label>Özel Gün / Zaman</label><select id="gunSecim"><option>Berat Kandili</option><option>Kadir Gecesi</option><option>Mevlid Kandili</option><option>Regaib Kandili</option><option>Miraç Kandili</option><option>Ramazan Bayramı</option><option>Kurban Bayramı</option><option>Cuma Günü</option><option>Ramazan Ayı</option><option>Arefe Günü</option></select></div>
<div><label>Üslup</label><select id="uslup"><option value="samimi">Samimi</option><option value="resmi">Resmî</option><option value="kurumsal">Kurumsal</option><option value="dua">Dua ağırlıklı</option></select></div>
<div><label>Mesaj Uzunluğu</label><select id="uzunluk"><option value="kisa">Kısa</option><option value="orta" selected>Orta</option><option value="uzun">Uzun</option></select></div>
<div><label>Hitap</label><select id="hitap"><option value="">Hitap ekleme</option><option>Değerli Dostlarım</option><option>Kıymetli Dostlarım</option><option>Değerli Mesai Arkadaşlarım</option><option>Kıymetli Ailem</option><option>Değerli Çalışma Arkadaşlarımız</option></select></div>
<div class="full"><label>Özel Vurgu ve Anahtar Kelimeler</label><input id="anahtarKelime" placeholder="Örn: Gazze, Doğu Türkistan, birlik, kardeşlik, huzur, sağlık..."></div>
<div class="full"><label>İsim / Kurum / Şirket Adı (İsteğe bağlı imza)</label><input id="imza" placeholder="Örn: Ahmet Yılmaz veya Kurum Adı"></div>
</div>
<div class="btnrow"><button class="primary" onclick="mesajOlustur()">✨ Mesajı Oluştur</button><button class="secondary" onclick="mesajOlustur()">🔄 Başka Bir Mesaj Üret</button></div>
<div class="preview"><h3>Oluşturulan Mesaj</h3><textarea id="sonuc" readonly placeholder="Mesajınız burada görünecek..."></textarea><div class="actions"><button class="blue" onclick="mesajKopyala()">📋 Kopyala</button><button class="secondary" onclick="whatsappPaylas()">🟢 WhatsApp</button><button class="gold" onclick="kartOlustur(false)">🖼️ Görsel Kart Oluştur</button></div><div id="status" class="status"></div></div>
<div class="preview"><h3>Paylaşım Kartı</h3><canvas id="kartCanvas" width="1080" height="1080"></canvas><div class="actions"><button class="primary" onclick="kartIndir()">⬇️ Görseli Kaydet</button><button class="secondary" onclick="kartPaylas()">📤 Görseli Paylaş</button><button class="secondary" onclick="kartOlustur(true)">🎨 Tasarımı Değiştir</button></div><div class="smallnote">“Tasarımı Değiştir” aynı mesajı korur; kartın arka plan ve çerçeve görünümünü sıradaki tasarıma geçirir.</div></div>
</div><div class="footer">Mesajmatik · İnternetsiz çalışır · Tek HTML dosyası</div></div></div>
<script>
const havuz={acilis:["Gönüllerin huzurla buluştuğu bu mübarek {gun} vesilesiyle","Rahmetin, bereketin ve kardeşliğin daha derinden hissedildiği bu güzel {gun} vesilesiyle","Duaların gönülden semaya yükseldiği bu kıymetli {gun} vesilesiyle","Kalplerimizin iyilik, merhamet ve umutla dolduğu bu mübarek {gun} gününde","Manevi iklimiyle gönüllerimizi kuşatan bu mübarek {gun} vesilesiyle"],dilek:["sağlık, huzur, bereket ve gönül ferahlığı diliyorum","sevdiklerinizle birlikte huzur ve afiyet içinde nice güzel günlere erişmenizi diliyorum","evlerinize bereket, gönüllerinize huzur, hayatınıza hayırlar getirmesini diliyorum","dualarınızın kabul, gönüllerinizin huzur, sofralarınızın bereketli olmasını temenni ediyorum","hayatınıza iyilik, umut ve güzellikler katmasını diliyorum"],dua:["Rabbim edilen duaları kabul, gönüllerdeki güzel niyetleri hayra tebdil eylesin.","Rabbim birlik ve beraberliğimizi daim, gönüllerimizi iman ve merhametle güçlü kılsın.","Rabbim bizleri sevdiklerimizle birlikte sağlık, huzur ve hayır üzere yaşatsın.","Dualarımızın kabulüne, gönüllerimizin ferahlığına ve güzel yarınlara vesile olsun.","Rabbim bu mübarek vakti affa, rahmete ve hayırlara vesile eylesin."]};
const temalar=[{a:"#eaf5ee",b:"#fffaf0",c:"#e5efe8",cer:"#c7a64d",ana:"#2f7d5a"},{a:"#f5f0e4",b:"#fffdf7",c:"#e8f0e8",cer:"#a8873c",ana:"#356a50"},{a:"#edf3ec",b:"#f8f4e8",c:"#e7eee4",cer:"#8e7540",ana:"#3f7559"},{a:"#f4eee0",b:"#eef5ef",c:"#faf8f1",cer:"#b08c42",ana:"#28664a"}];let temaIndex=0;
function sec(a){return a[Math.floor(Math.random()*a.length)]}
function ozelKapanis(gun){if(gun==="Cuma Günü")return"Cumanız mübarek olsun.";if(gun.includes("Kandili"))return"Kandiliniz mübarek olsun.";if(gun.includes("Gecesi"))return"Geceniz mübarek olsun.";if(gun.includes("Bayramı"))return"Bayramınız mübarek olsun.";if(gun==="Ramazan Ayı")return"Ramazan-ı Şerifiniz mübarek olsun.";if(gun==="Arefe Günü")return"Arefe gününüz mübarek olsun.";return"Bu mübarek vaktiniz hayırlara vesile olsun."}
function vurguCumlesi(anahtar){if(!anahtar)return"";const a=anahtar.toLowerCase();let c=` Özellikle ${anahtar} için gönülden ettiğimiz duaların hayırlara vesile olmasını diliyorum.`;if(a.includes("gazze")||a.includes("türkistan")||a.includes("mazlum"))c+=" Başta mazlum coğrafyalardaki kardeşlerimiz olmak üzere, zulüm ve sıkıntı içindeki tüm insanların selamete, huzura ve adalete kavuşması en büyük dualarımızdandır.";else if(a.includes("birlik")||a.includes("kardeş"))c+=" Birlik, beraberlik ve kardeşlik duygularımızın güçlenerek devam etmesini temenni ediyorum.";else if(a.includes("sağlık")||a.includes("huzur"))c+=" Sağlık, huzur ve gönül ferahlığının hepimizin hayatına daim olmasını temenni ediyorum.";return c}
function uslupDonustur(m,u){if(u==="resmi")return m.replaceAll("diliyorum","temenni ederim").replaceAll("dilerim","temenni ederim");if(u==="kurumsal")return m.replaceAll("diliyorum","temenni ediyoruz").replaceAll("dilerim","temenni ediyoruz").replaceAll("Rabbim","Yüce Allah");if(u==="dua")return m+" Allah kabul eylesin; gönüllerimizi iyilikten, merhametten ve güzel niyetlerden ayırmasın.";return m}
function mesajOlustur(){const gun=gunSecim.value,uslup=document.getElementById("uslup").value,uzunluk=document.getElementById("uzunluk").value,hitap=document.getElementById("hitap").value,anahtar=anahtarKelime.value.trim(),imza=document.getElementById("imza").value.trim();let govde=sec(havuz.acilis).replaceAll("{gun}",gun)+"; "+sec(havuz.dilek)+".";if(uzunluk!=="kisa"){govde+=vurguCumlesi(anahtar)+" "+sec(havuz.dua)}if(uzunluk==="uzun")govde+=" Sevgi, saygı, hoşgörü ve paylaşma duygularımızın güçlenmesine; kırgınlıkların yerini muhabbetin almasına vesile olmasını temenni ediyorum. Bu özel vaktin hayatımıza güzellik ve bilinç katmasını diliyorum.";if(uzunluk==="kisa"&&anahtar)govde+=vurguCumlesi(anahtar);govde+=" "+ozelKapanis(gun);govde=uslupDonustur(govde,uslup);let m=(hitap?hitap+",\n\n":"")+govde;if(imza)m+=uslup==="kurumsal"?`\n\n${imza}`:`\n\nSaygılarımla,\n${imza}`;sonuc.value=m;status.textContent="Yeni bir mesaj oluşturuldu."}
async function mesajKopyala(){if(!sonuc.value){alert("Önce bir mesaj oluşturmalısınız.");return}try{await navigator.clipboard.writeText(sonuc.value)}catch(e){sonuc.select();document.execCommand("copy")}status.textContent="Mesaj panoya kopyalandı."}
function whatsappPaylas(){if(!sonuc.value){alert("Önce bir mesaj oluşturmalısınız.");return}window.open("https://wa.me/?text="+encodeURIComponent(sonuc.value),"_blank")}
function wrapLines(ctx,text,maxWidth){const words=text.trim().split(/\s+/),lines=[];let line="";for(const word of words){const test=line?line+" "+word:word;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=word}else line=test}if(line)lines.push(line);return lines}
function drawJustifiedLine(ctx,line,x,y,width,isLast){const words=line.split(" ");if(isLast||words.length===1){ctx.textAlign="left";ctx.fillText(line,x,y);return}const total=words.reduce((s,w)=>s+ctx.measureText(w).width,0),gap=(width-total)/(words.length-1);let cx=x;ctx.textAlign="left";for(const w of words){ctx.fillText(w,cx,y);cx+=ctx.measureText(w).width+gap}}
function kartOlustur(temaDegistir=false){if(!sonuc.value.trim())mesajOlustur();if(temaDegistir)temaIndex=(temaIndex+1)%temalar.length;const t=temalar[temaIndex],canvas=kartCanvas,ctx=canvas.getContext("2d"),gun=gunSecim.value,hitap=document.getElementById("hitap").value.trim(),imza=document.getElementById("imza").value.trim();canvas.style.display="block";const g=ctx.createLinearGradient(0,0,1080,1080);g.addColorStop(0,t.a);g.addColorStop(.55,t.b);g.addColorStop(1,t.c);ctx.fillStyle=g;ctx.fillRect(0,0,1080,1080);ctx.strokeStyle=t.cer;ctx.lineWidth=5;ctx.strokeRect(52,52,976,976);ctx.beginPath();ctx.arc(540,150,55,0,Math.PI*2);ctx.fillStyle=t.ana;ctx.fill();ctx.fillStyle="#fff";ctx.font="58px Georgia,serif";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText("☾",540,148);ctx.fillStyle=t.ana;ctx.font="bold 48px Arial";ctx.textBaseline="alphabetic";ctx.fillText(gun,540,260);ctx.strokeStyle=t.cer;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(270,300);ctx.lineTo(810,300);ctx.stroke();
let raw=sonuc.value.trim(),body=raw;if(hitap&&body.startsWith(hitap+","))body=body.slice((hitap+",").length).trim();if(imza){const markers=[`Saygılarımla,\n${imza}`,imza];for(const mk of markers){const p=body.lastIndexOf(mk);if(p>=0){body=body.slice(0,p).trim();break}}}
const left=125,width=830;let y=390;ctx.fillStyle="#26332c";ctx.textBaseline="alphabetic";if(hitap){ctx.font="bold 31px Arial";ctx.textAlign="left";ctx.fillText(hitap+",",left,y);y+=72}ctx.font="30px Arial";const lines=wrapLines(ctx,body,width),lineH=44,maxBodyY=820;for(let i=0;i<lines.length&&y<=maxBodyY;i++){drawJustifiedLine(ctx,lines[i],left,y,width,i===lines.length-1);y+=lineH}
if(imza){y=Math.max(y+44,850);ctx.font="italic 26px Arial";ctx.textAlign="right";ctx.fillStyle="#59645d";if(document.getElementById("uslup").value!=="kurumsal"){ctx.fillText("Saygılarımla,",955,y);y+=38}ctx.font="bold 30px Arial";ctx.fillStyle="#26332c";ctx.fillText(imza,955,y)}ctx.fillStyle="#7a857e";ctx.font="22px Arial";ctx.textAlign="center";ctx.fillText("Mesajmatik",540,985);status.textContent=temaDegistir?"Kart tasarımı değiştirildi.":"Paylaşım kartı oluşturuldu."}
function kartIndir(){if(!kartCanvas.style.display)kartOlustur(false);const a=document.createElement("a");a.download="mesajmatik-kart.png";a.href=kartCanvas.toDataURL("image/png");a.click()}
async function kartPaylas(){if(!kartCanvas.style.display)kartOlustur(false);kartCanvas.toBlob(async blob=>{const file=new File([blob],"mesajmatik-kart.png",{type:"image/png"});if(navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:"Mesajmatik Kartı"})}catch(e){}}else alert("Bu cihaz doğrudan görsel paylaşımını desteklemiyor. Görseli Kaydet seçeneğini kullanabilirsiniz.")},"image/png")}
mesajOlustur();
</script>
</body></html>
